# SPDX-License-Identifier: MIT OR Apache-2.0
#
# IronAuth Cargo virtual workspace. The crate graph mirrors the design seams laid
# down in milestone M1: ironauth-env is the determinism seam (all wall-clock time,
# monotonic time, and entropy access flows through it, enforced by
# scripts/invariant-lints.sh), ironauth-config is the strict configuration layer
# (fail-fast parsing, secret indirection, the feature maturity ladder), and
# ironauth is the single-binary entry point. Later M1 issues add the server
# skeleton (#5), the persistence substrate (#6, #7), the JOSE and signing cores
# (#8, #9), the SSRF-hardened fetcher (#10), and the management API skeleton
# (#11), each as its own crate behind a documented seam.

[workspace]
resolver = "2"
members = [
    "crates/ironauth-env",
    "crates/ironauth-cel",
    "crates/ironauth-config",
    "crates/ironauth-server",
    "crates/ironauth-store",
    "crates/ironauth-scim",
    "crates/ironauth-fetch",
    "crates/ironauth-jose",
    "crates/ironauth-hash-scheme",
    "crates/ironauth-webauthn",
    "crates/ironauth-kms",
    "crates/ironauth-admin",
    "crates/ironauth-admin-ui",
    "crates/ironauth-hooks",
    "crates/ironauth-oidc",
    "crates/ironauth-quota",
    "crates/ironauth-screening",
    "crates/ironauth-apply",
    "crates/ironauth-import",
    "crates/ironauth-importers",
    "crates/ironauth-connector",
    "crates/ironauth-journey",
    "crates/ironauth",
    # The EDGE VERIFY SNIPPET (issue #118). A workspace member rather than a standalone crate
    # with its own lockfile, deliberately: `cargo-deny`, `clippy --workspace` and `cargo fmt`
    # then cover it without anybody wiring it in, and a snippet nobody's gates read is a snippet
    # that rots. It is still copy-pasteable -- a user takes `src/lib.rs` and three dependencies.
    "snippets/fastly-compute-verify",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ELares/IronAuth"

[workspace.dependencies]
# The IronBus client (issue #104): the OPTIONAL notification backbone for the
# transactional outbox. Optional in the strict sense the issue requires: Postgres alone
# is a complete, supported mode, and this crate is behind the `ironbus` feature so a
# deployment that does not want it does not build it.
ironbus-client = { version = "0.1.0", default-features = false }
ironauth-env = { path = "crates/ironauth-env", version = "0.1.0" }
ironauth-hash-scheme = { path = "crates/ironauth-hash-scheme", version = "0.2.0" }
ironauth-config = { path = "crates/ironauth-config", version = "0.1.0" }
ironauth-connector = { path = "crates/ironauth-connector", version = "0.1.0" }
ironauth-server = { path = "crates/ironauth-server", version = "0.1.0" }
ironauth-store = { path = "crates/ironauth-store", version = "0.1.0" }
ironauth-fetch = { path = "crates/ironauth-fetch", version = "0.1.0" }
ironauth-jose = { path = "crates/ironauth-jose", version = "0.1.0" }
ironauth-hooks = { path = "crates/ironauth-hooks", version = "0.1.0" }
ironauth-webauthn = { path = "crates/ironauth-webauthn", version = "0.1.0" }
ironauth-kms = { path = "crates/ironauth-kms", version = "0.1.0" }
ironauth-admin = { path = "crates/ironauth-admin", version = "0.1.0" }
ironauth-admin-ui = { path = "crates/ironauth-admin-ui", version = "0.1.0" }
ironauth-oidc = { path = "crates/ironauth-oidc", version = "0.1.0" }
ironauth-scim = { path = "crates/ironauth-scim", version = "0.1.0" }
# `version` alongside `path`, like every sibling above. Without it this is a WILDCARD
# dependency and `cargo deny check bans` refuses it -- which nothing noticed while
# `ironauth-cel` had no dependents, because a wildcard nobody depends on is never resolved.
# Wiring it into `ironauth-oidc` for #113 criterion 2 is what surfaced it.
ironauth-cel = { path = "crates/ironauth-cel", version = "0.1.0" }
ironauth-quota = { path = "crates/ironauth-quota", version = "0.1.0" }
ironauth-screening = { path = "crates/ironauth-screening", version = "0.1.0" }
ironauth-apply = { path = "crates/ironauth-apply", version = "0.1.0" }
ironauth-import = { path = "crates/ironauth-import", version = "0.1.0" }
ironauth-importers = { path = "crates/ironauth-importers", version = "0.1.0" }
ironauth-journey = { path = "crates/ironauth-journey", version = "0.1.0" }
getrandom = "0.4"

# OpenAPI 3.1 source of truth for the management API (crates/ironauth-admin,
# issue #11). utoipa derives the OpenAPI 3.1 document from the `#[utoipa::path]`
# annotations on the axum handlers; the handlers are listed once in the
# `#[derive(OpenApi)]` `paths(...)` and wired to the same paths in the router, and
# scripts/openapi-check.sh regenerates and git-diffs the committed spec so any
# drift fails the build. utoipa is MIT OR Apache-2.0 with MSRV 1.75 (below the
# workspace 1.85 floor), pulls no non-permissive dependency, and is pure Rust
# (musl static clean). axum_extras teaches the macros axum's Path/Query
# extractors. The utoipa-axum route-binding helper is deliberately NOT used: it
# pulls the unmaintained `paste` crate (RUSTSEC-2024-0436), which `cargo deny`
# rejects; wiring the router by hand keeps the dependency graph clean.
utoipa = { version = "5", features = ["axum_extras"] }

# Persistence and isolation layer (crates/ironauth-store). Runtime query API
# only (sqlx::query / query_as / QueryBuilder), never the compile-time-checked
# query! macros, so the DB-free CI lanes (clippy, msrv, musl, cargo check) stay
# database-free; a live database is needed only to run the integration tests.
# TLS: rustls with the ring provider and the OS trust store
# (tls-rustls-ring-native-roots). The plain `tls-rustls` alias pulls
# webpki-roots (CDLA-Permissive-2.0, not on the deny.toml allowlist); the
# native-roots variant uses rustls-native-certs (MIT/Apache/ISC) instead. No
# native-tls/openssl, no aws-lc, no webpki-roots, so the tree stays permissive
# and the musl static lane holds (rustls-native-certs reads /etc/ssl at runtime,
# no C dependency). Pinned to the 0.8 line: 0.9 floors above MSRV 1.85 (see the
# crate's CHANGELOG and Cargo.lock pins).
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
    "postgres",
] }
base64 = "0.23"
# The vetted allowlist HTML sanitizer (crates/ironauth-oidc, issue #86): the security
# core of safe branding rich text. Built on html5ever, it parses to a DOM and reserializes
# ONLY an explicit allowlist of tags and attributes, so the Casdoor class of stored XSS is
# closed by construction rather than by a fragile blocklist. Configured to a minimal subset
# (b i strong em u p br, plus a[href] on an https only scheme with a forced rel). Pure Rust,
# permissive (MIT OR Apache-2.0), and its html5ever/markup5ever/tendril subtree is permissive
# too (see deny.toml); no C dependency, so the musl static lane holds.
ammonia = "4"
# Unicode NFKC normalization for the central identifier canonicalization seam
# (crates/ironauth-store, issue #54). NFKC folds the compatibility-confusable class
# (fullwidth ASCII, ligatures, circled forms) onto ordinary forms so a homoglyph
# spoof of a login handle canonicalizes to the same value as the real one. Pure
# Rust, permissive (MIT OR Apache-2.0), and ALREADY in the tree transitively (sqlx
# -> url -> idna -> idna_adapter -> unicode-normalization), so this adds a direct
# edge, not a new crate: the dependency graph, licenses, MSRV 1.85, and the musl
# static lane are unchanged.
unicode-normalization = "0.1"
# Unicode General_Category lookup for the identifier canonicalization seam
# (crates/ironauth-store, issue #54): step 1 strips invisible / control / format /
# separator characters by PROPERTY (Cc/Cf/Zl/Zp) rather than a hand-curated
# code-point list with gaps. Pure Rust, permissive (MIT OR Apache-2.0), and ALREADY
# in the tree transitively (sqlx -> ... -> stringprep -> unicode-properties), so this
# adds a direct edge, not a new crate; MSRV 1.85 and the musl static lane hold. Only
# the general-category table is pulled (default emoji feature disabled).
unicode-properties = { version = "0.1", default-features = false, features = [
    "general-category",
] }
# Full Unicode Default Case Folding for the identifier canonicalization seam
# (crates/ironauth-store, issue #54): folds the case pairs where simple lowercasing
# diverges (the German sharp s, the Greek final sigma), so a mixed-case enumeration
# variant of a login handle canonicalizes to one form. A standard unicode-rs crate,
# permissive (MIT), pure Rust with no build script, depending only on
# unicode-normalization (already in the tree). MSRV 1.85 and the musl static lane
# hold; cargo-deny passes.
caseless = "0.2"
# Argon2id password hashing for the bootstrap login/registration surface
# (issue #20), at the OWASP default parameters. Pure Rust (RustCrypto), permissive
# (MIT OR Apache-2.0), no C dependency, so the tree stays musl-static clean and
# MSRV 1.85 holds. Salt bytes are drawn from the ironauth-env entropy seam (never
# the crate's own RNG), so hashing stays deterministic under test and the
# invariant lints are satisfied.
argon2 = "0.5"
# The two OAuth2/OIDC client-secret authentication methods interoperate with a
# real third-party Rust OAuth 2.0 client (issue #20 acceptance): the oauth2 crate
# drives both client_secret_basic and client_secret_post against the token
# endpoint in a DB-backed test. default-features off drops its bundled reqwest
# client (the test drives the in-process router directly), keeping the dev-graph
# lean and free of any advisory-flagged transitive crate. MIT OR Apache-2.0,
# builds under MSRV 1.85.
oauth2 = { version = "5", default-features = false }
# Direct crypto primitives for the hardened JOSE verifier (crates/ironauth-jose;
# see docs/adr/0004-jose-verification.md). ring is ALREADY in the tree via
# rustls; this adds a direct edge, not a new crate, so the graph, licenses
# (Apache-2.0 AND ISC, both on the deny.toml allowlist), MSRV 1.85, and the musl
# static lane are unchanged. Default features keep `alloc` on, which the RSA
# verification path requires. The verifier is built on ring's low-level
# signature primitives on purpose: high-level JOSE crates carry the very CVE
# classes issue #8 closes.
ring = "0.17"
# Asymmetric key GENERATION for day-one signing-key provisioning
# (crates/ironauth-jose, issue #93): ring cannot generate RSA keys at all and
# binds its ECDSA generation to its own RNG, so ES256 and RS256 day-one keys are
# generated with the RustCrypto p256 and rsa crates and exported to PKCS#8 / PKCS#1
# DER, then LOADED and signed exclusively through ring (the one signature backend).
# Both crates are used ONLY for keygen + DER export, NEVER to sign, verify, or
# decrypt: the rsa crate's Marvin timing advisory (RUSTSEC-2023-0071) is on the
# RSA-DECRYPTION path, which is unreachable here (scoped-ignored in deny.toml). The
# keygen RNG is a ChaCha20 stream SEEDED from the ironauth-env entropy seam (never
# an OS RNG), so day-one keys are reproducible under a fixed test entropy source and
# the determinism seam holds. Both are pure Rust (RustCrypto), permissive (MIT OR
# Apache-2.0, whole subtree allowlisted), no C dependency, so the musl static lane
# holds and MSRV 1.85 is satisfied. RSA is fixed at 2048 bits (the enforced modulus
# floor). Default features are trimmed to keygen + DER: no signing, no PEM.
p256 = { version = "0.13", default-features = false, features = [
    "arithmetic",
    "pkcs8",
    "std",
] }
rsa = { version = "0.9", default-features = false, features = ["std"] }
# The determinism-seam bridge (crates/ironauth-env): a ChaCha20 CSPRNG seeded from
# a 32-byte draw off the entropy seam, so the p256/rsa keygen above expands seam
# entropy deterministically. Already in the tree transitively; this adds a direct
# edge, not a new crate. Pure Rust, permissive (MIT OR Apache-2.0), musl clean.
rand_chacha = "0.3"
# SHA-256 for migration checksums (drift and tamper detection). Pure Rust
# (no asm/C feature), permissive (MIT OR Apache-2.0); MSRV 1.85 and musl clean.
# NOTE: this is no longer only a direct edge onto a crate sqlx already pulls.
# sqlx still depends on the 0.10 line, so the graph carries both 0.10 and 0.11.
# deny.toml sets multiple-versions = "warn", so that duplication is accepted
# rather than silent; it resolves when sqlx moves to the 0.11 line.
sha2 = "0.11"
# HMAC-SHA256 for AWS SigV4 (issue #110). RustCrypto, the same family as sha2 above;
# hand-rolling HMAC in an identity product is not an acceptable alternative even though
# the construction is short.
hmac = "0.13"
# SHA-1 for the HIBP k-anonymity breached-password screening (crates/ironauth-screening,
# issue #63). HIBP's range API keys on the SHA-1 of the password; this is NOT a
# password hash (Argon2id owns that, issue #62), only the range lookup key, computed
# LOCALLY so only the 5-char hex prefix ever leaves the process. Pure Rust
# (RustCrypto), permissive (MIT OR Apache-2.0), no C dependency, so the tree stays
# musl-static clean and MSRV 1.85 holds. Shares the RustCrypto `digest` traits already
# in the tree via sha2, so this adds a direct edge, not a new trait graph: that is true
# only on the 0.11 line, which is built on `digest` 0.11 exactly as sha2 0.11 is. The
# earlier 0.10 pin sat on `digest` 0.10 and so carried a SECOND trait graph beside sha2.
# 0.11 floors its own MSRV at 1.85, exactly the workspace floor, so there is no headroom
# left here: a later sha1 minor that raises its floor cannot be taken without moving the
# workspace floor first.
sha1 = "0.11"
# CBOR decoding for the WebAuthn ceremony layer (crates/ironauth-webauthn, issue
# #65): the registration attestationObject and the COSE credential public key are
# CBOR. ciborium is the standard Rust CBOR implementation, pure Rust with no build
# script and no C dependency (musl static clean), and its whole tree is permissive
# and on the deny.toml allowlist (ciborium/ciborium-io/ciborium-ll are Apache-2.0,
# half is MIT OR Apache-2.0). MSRV 1.58, well below the workspace 1.85 floor. Only
# the decode path is used: a bounded walk of a `ciborium::value::Value` tree, never
# a signature or key primitive (those stay in ironauth-jose on ring). The
# alternative, webauthn-rs, is rejected: webauthn-rs-core is MPL-2.0, which is NOT
# on the cargo-deny license allowlist and would fail `cargo deny check`.
ciborium = "0.2"
# CEILINGED at the MSRV, not merely versioned. trybuild 1.0.120 declares
# `rust-version = "1.88"`, above this workspace's 1.85 promise, so an unbounded
# requirement lets `cargo update` walk into a resolver refusal on the `msrv (1.85)`
# lane, which is exactly what happened to the dependabot PR proposing 1.0.120.
#
# THE BOUND IS 1.0.120, NOT 1.0.119, and the difference is the whole point. 1.0.119
# declares `rust-version = "1.85"` and is fine; the first version of this ceiling
# excluded it, which would have forbidden the newest release inside our own MSRV. On
# the last occurrence of this wall (dependabot #671) the stated condition for taking a
# new release was "if trybuild publishes a version inside 1.85" -- and 1.0.119 is
# exactly that, published a day before 1.0.120. Its one change, fixing feature
# detection under the new Cargo build-dir layout, is directly relevant on a repo
# pinned to 1.97.0.
#
# `scripts/msrv-audit.sh` catches a regression in the local gate; this stops `cargo update`
# walking into it. It is PAIRED with a dependabot `ignore` entry, because a manifest
# requirement is something dependabot edits rather than a policy it reads -- it edited this
# file in #864 -- and 1.0.119 to 1.0.120 is a PATCH bump, so a re-proposal would ride inside
# the grouped cargo PR and take every safe bump with it.
#
# Both come off when the MSRV moves, which is a deliberate decision rather than a build
# detail: it is a published promise.
trybuild = ">=1.0, <1.0.120"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
schemars = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Parse the (possibly repeated) RFC 8707 `resource` request parameter (issue #28)
# from a raw query/form body, which a typed serde struct cannot capture. This is the
# SAME crate axum already uses for form/query extraction, so no new crate enters the
# graph; permissive, MSRV 1.85 and musl clean.
serde_urlencoded = "0.7"

# HTTP runtime and middleware (see docs/adr/0001-http-runtime.md). Pure Rust,
# musl-static friendly; no TLS crate on the default path (a terminating proxy
# handles TLS).
tokio = { version = "1", default-features = false }
axum = { version = "0.8", default-features = false }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.7", default-features = false }
http = "1"
http-body-util = "0.1"

# Outbound fetch stack (crates/ironauth-fetch, the single SSRF-hardened
# dispatcher; see docs/adr/0003-outbound-fetch.md). hyper's low-level client
# connection API is used with a custom connector so the host is resolved,
# validated, and pinned exactly once (no DNS-rebinding window); no high-level
# pooling client that would re-resolve. TLS is rustls with the ring provider and
# the OS trust store, matching ironauth-store: no aws-lc, no native-tls/openssl,
# no webpki-roots, so the tree stays permissive and the musl static lane holds.
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "logging",
    "tls12",
    "ring",
] }
rustls-native-certs = "0.8"
# TEST-ONLY certificate generation (issue #959). Reached solely through
# ironauth-fetch's `test-harness` feature, which is off by default, so no released
# binary links it. `ring` and no `pem`, to match the crypto provider the rest of the
# TLS stack already uses and to keep the graph to DER, which is what rustls consumes.
#
# HELD AT 0.13 ON PURPOSE, and this is not a stale pin waiting to be bumped.
#
# rcgen 0.14.8 raised its declared `rust-version` to 1.88, and this workspace promises
# 1.85. That is not a local-gate quibble: CI's `msrv (1.85)` lane runs
# `cargo check --workspace --all-features --all-targets`, so `--all-features` turns this
# test-only feature on and the resolver refuses. Being optional buys no exemption.
#
# A caret `0.14` therefore cannot be used, because it resolves forward to 0.14.9. What
# WOULD work is an exact `=0.14.7`, which still declares 1.71 and passes the audit
# (measured, not assumed). It is rejected for a different reason: an exact pin forfeits
# every future patch release, including a security one, in exchange for a newer API this
# code does not need. A caret on 0.13 takes patches freely and all of them are MSRV-safe.
#
# So the constraint is "0.14.8+ needs 1.88", not "0.14 needs 1.88". An earlier version of
# this comment said the latter, which is wrong and would have misled anyone re-evaluating
# it later.
#
# The lockfile also holds `time` at 0.3.41; rcgen pulls it in and 0.3.47 onward declare
# 1.88. `scripts/msrv-audit.sh` fails the gate if either drifts forward, so this comment
# explains a constraint the tooling already enforces rather than being its only guard.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
bytes = "1"

# Observability: structured logs and Prometheus metrics.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# OpenTelemetry OTLP trace export, compiled only behind the non-default `otlp`
# feature so the default build and the musl static lane stay lean and
# protoc-free (grpc-tonic ships pre-generated protobuf code).
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false }
tracing-opentelemetry = "0.33"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# Pedantic is the workspace floor; CI promotes warnings to errors with -D warnings.
# Exceptions are granted per item with an inline reason, never blanket-allowed.
pedantic = { level = "warn", priority = -1 }

# RSA 2048 keygen (day-one multi-algorithm signing-key provisioning, issue #93) is
# dominated by bignum primality testing, which is punishingly slow in an unoptimized
# debug build (seconds per key), inflating the wall clock of any test that creates
# environments. Optimize only the bignum keygen crates in the dev profile so debug
# tests and the local loop stay fast; this changes no behavior and leaves the rest of
# the workspace unoptimized for fast iteration. Signing and verification run on ring;
# these crates are keygen and DER export only.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

# RUSTSEC-2026-0041 (lz4_flex <= 0.11.5): decompressing invalid data can leak information
# from uninitialized memory or a reused output buffer. It reaches this workspace
# transitively, and ONLY transitively: ironbus-client -> ironbus-core -> lz4_flex 0.10.0.
# Nothing here declares lz4_flex, so no bump in this repo can move it -- the requirement
# lives in ironbus-core, which is published from a repository we own.
#
# Fixed AT THE SOURCE rather than ignored: ELares/IronBus#1203 bumps both crates that
# declare it to 0.11.6, keeping the same pure-Rust feature set. This pin points at that
# commit so cargo-deny is honestly clean here instead of carrying an advisory ignore that
# claims a reachability nobody measured.
#
# TEMPORARY BY CONSTRUCTION. It comes out the moment ironbus-core publishes a version
# carrying the bump; at that point this whole block is deleted and the ordinary version
# requirement resolves to a patched release. Tracked by ELares/IronAuth#892.
[patch.crates-io]
ironbus-core = { git = "https://github.com/ELares/IronBus.git", rev = "8cb429c89b79604c1bf7291b6e92ee4b5476cfcc" }
ironbus-proto = { git = "https://github.com/ELares/IronBus.git", rev = "8cb429c89b79604c1bf7291b6e92ee4b5476cfcc" }
