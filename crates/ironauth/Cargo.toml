# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "ironauth"
version = "0.1.0"
description = "IronAuth: a standards-first OpenID Connect identity platform in one binary"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The dev capture sink implements the same async delivery seam the production sender does
# (issue #111). Already in the lock file; no new supply-chain surface.
async-trait = "0.1"
# Parsing the deployment public URL to the host half of every Message-ID (issue #111).
http.workspace = true
ironauth-env.workspace = true
ironauth-config.workspace = true
ironauth-server.workspace = true
metrics.workspace = true
# The management API (issue #11) is mounted on the management plane when a
# bootstrap operator token is configured; the store provides the control-plane
# connection. Both are rustls/ring only (no openssl/native-tls), so the musl
# static lane holds.
ironauth-store.workspace = true
ironauth-admin.workspace = true
# The OIDC provider (issue #12) is mounted on the PUBLIC plane when
# oidc.enabled is set; the store provides the data-plane connection. rustls/ring
# only, so the musl static lane holds.
# The WASM hook engine (issue #114), installed behind the experimental maturity flag.
ironauth-hooks.workspace = true
ironauth-oidc.workspace = true
# The admin console SPA (issue #90) is embedded and mounted on the PUBLIC plane
# under /admin when admin_spa.enabled is set. It embeds its assets with
# rust-embed and owns no store connection, so the musl static lane holds.
ironauth-admin-ui.workspace = true
ironauth-jose.workspace = true
# The tenant/environment quota engine (issue #50): the boot path builds one
# enforcer from the [quota] config and hands it to the OIDC data plane. Pure,
# in-memory token buckets with no persistence or network dependency.
ironauth-quota.workspace = true
# Breached-password screening and the NIST SP 800-63B-4 policy (issue #63): the boot
# path builds the policy and the screening provider (online HIBP or offline corpus) from
# the [password_policy] config and installs them on the OIDC data plane.
ironauth-screening.workspace = true
# The SSRF-hardened outbound fetcher (issue #10): the boot path builds the shared fetcher
# the online HIBP screening provider dispatches through. Depending on ironauth-fetch (not
# an HTTP-client crate) keeps scripts/http-audit.sh satisfied.
ironauth-fetch.workspace = true
# The config-as-code CLI (issue #51): the `validate`/`plan`/`apply`/`drift`
# subcommands dispatch into this crate. It is a THIN client of the management API
# and owns its own control-plane HTTP client (the outbound-HTTP dependency lives
# there, not in this server-wiring binary, so scripts/http-audit.sh keeps this
# crate free of an HTTP-client dependency).
ironauth-apply.workspace = true
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
tracing.workspace = true
# `ironauth login` stores a structured credential (issue #120), and the keychain holds ONE
# opaque string per entry, so the record needs an encoding. JSON rather than TOML because
# this is a machine-written blob nobody edits by hand, and `serde_json` is already in the
# tree. This is the JSON surface the dev-dependency note above once said the binary had
# none of; that statement was true until this landed.
serde.workspace = true
serde_json.workspace = true

# `vendored` builds libdbus INTO the binary instead of linking the host's. Without it the
# Secret Service backend needs libdbus-1-dev present at build time, which is why the clippy,
# msrv and musl lanes had all been failing on `libdbus-sys` -- they build --all-features on a
# runner that has no dbus headers, and the musl static target could not have used the host's
# anyway. Vendoring fixes all three without asking every builder to install a system package.
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[features]
# Passes the optional IronBus wake-up backbone through to ironauth-store (issue #104).
ironbus = ["ironauth-store/ironbus"]
# Forwarded to the server crate: OTLP trace export off by default so the
# default build and the musl static lane stay lean and protoc-free.
otlp = ["ironauth-server/otlp"]
# Enables the ironauth-store real-database harness for the DB-backed CLI integration
# test (issue #72). Test-only; adds no production surface.
#
# It also turns on the two crates' test-only OBSERVATION accessors, which the
# boot-wiring harness (issue #414) reads the assembled plane states through: the
# management plane's shared runtime objects and issuer registry, and each plane store's
# master-key handle. Each is gated on its own crate's `testing`, so nothing the harness
# needs to observe is compiled into the production binary.
testing = ["ironauth-store/testing", "ironauth-admin/testing"]

[dev-dependencies]
# The hermetic fetcher seam (issue #674). Test builds only, so no production
# binary can construct a fetcher that skips the OS trust store.
ironauth-fetch = { workspace = true, features = ["test-harness"] }
# The step-up-policy CLI integration test (issue #72) stands up a throwaway database
# (the store test-support harness), seeds a scope, drives the compiled `ironauth`
# binary as a subprocess against it, and reads the written policy back through the same
# audited repository the enforcement path reads.
ironauth-store = { workspace = true, features = ["testing"] }
ironauth-env = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# The boot-wiring harness (issue #414) derives its subject list from the serialized shape
# of `Config` itself and compares whole config sections across the two plane states as
# JSON, so a section that grows a key is compared with the new key rather than silently
# around it. Both are also REAL dependencies now (see below), so this dev entry is
# redundant rather than load-bearing; it is kept so the harness's reason stays recorded.

# The step-up-policy CLI integration test needs the store test-support harness; it is
# gated on the `testing` feature so the default build stays lean, exactly as the
# ironauth-oidc DB suites are.
[[test]]
name = "step_up_policy_cli"
required-features = ["testing"]

# The outbox retention boot suite (issue #104, PR 3) boots the COMPILED `ironauth serve`
# against a throwaway database and watches the queue. It is the only thing in the tree that
# observes the `serve` call site itself: replacing that call with a no-op left every other
# test green. Same gating as the CLI suite above.
[[test]]
name = "serve_retention_boot"
required-features = ["testing"]

[lints]
workspace = true
