# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "ironauth"
version = "0.1.0"
description = "IronAuth: a standards-first OpenID Connect identity platform in one binary"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The backup command's checksum and hex encoding (issue #153). Both crates are already in the
# workspace lock file; no new supply-chain surface.
sha2 = "0.10"
hex = "0.4"
# The dev capture sink implements the same async delivery seam the production sender does
# (issue #111). Already in the lock file; no new supply-chain surface.
async-trait = "0.1"
# Parsing the deployment public URL to the host half of every Message-ID (issue #111).
http.workspace = true
ironauth-env.workspace = true
ironauth-config.workspace = true
ironauth-hot.workspace = true
ironauth-server.workspace = true
metrics.workspace = true
# The management API (issue #11) is mounted on the management plane when a
# bootstrap operator token is configured; the store provides the control-plane
# connection. Both are rustls/ring only (no openssl/native-tls), so the musl
# static lane holds.
ironauth-store.workspace = true
ironauth-admin.workspace = true
# The OIDC provider (issue #12) is mounted on the PUBLIC plane when
# oidc.enabled is set; the store provides the data-plane connection. rustls/ring
# only, so the musl static lane holds.
# The WASM hook engine (issue #114), installed behind the experimental maturity flag.
#
# OPTIONAL for the MSRV reason `ironauth-oidc`'s copy of this comment gives: wasmtime and
# cranelift declare 1.95 and this binary publishes 1.85. The default artifact is unchanged.
ironauth-hooks = { workspace = true, optional = true }
ironauth-oidc.workspace = true
# The admin console SPA (issue #90) is embedded and mounted on the PUBLIC plane
# under /admin when admin_spa.enabled is set. It embeds its assets with
# rust-embed and owns no store connection, so the musl static lane holds.
ironauth-admin-ui.workspace = true
# The SCIM 2.0 inbound surface (issue #135). Its dependencies are already in this binary's
# graph and none of them is an HTTP client or a TLS stack, so the static musl lane is
# unaffected. The set is deliberately not enumerated here: an earlier version listed six
# crates by name and a seventh was added in the very next commit, which is what a list
# beside the thing it describes does.
ironauth-scim.workspace = true
ironauth-jose.workspace = true
# The tenant/environment quota engine (issue #50): the boot path builds one
# enforcer from the [quota] config and hands it to the OIDC data plane. Pure,
# in-memory token buckets with no persistence or network dependency.
ironauth-quota.workspace = true
# Breached-password screening and the NIST SP 800-63B-4 policy (issue #63): the boot
# path builds the policy and the screening provider (online HIBP or offline corpus) from
# the [password_policy] config and installs them on the OIDC data plane.
ironauth-screening.workspace = true
# The SSRF-hardened outbound fetcher (issue #10): the boot path builds the shared fetcher
# the online HIBP screening provider dispatches through. Depending on ironauth-fetch (not
# an HTTP-client crate) keeps scripts/http-audit.sh satisfied.
ironauth-fetch.workspace = true
# The config-as-code CLI (issue #51): the `validate`/`plan`/`apply`/`drift`
# subcommands dispatch into this crate. It is a THIN client of the management API
# and owns its own control-plane HTTP client (the outbound-HTTP dependency lives
# there, not in this server-wiring binary, so scripts/http-audit.sh keeps this
# crate free of an HTTP-client dependency).
ironauth-apply.workspace = true
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
tracing.workspace = true
# `ironauth login` stores a structured credential (issue #120), and the keychain holds ONE
# opaque string per entry, so the record needs an encoding. JSON rather than TOML because
# this is a machine-written blob nobody edits by hand, and `serde_json` is already in the
# tree. This is the JSON surface the dev-dependency note above once said the binary had
# none of; that statement was true until this landed.
serde.workspace = true
serde_json.workspace = true

# `vendored` builds libdbus INTO the binary instead of linking the host's. Without it the
# Secret Service backend needs libdbus-1-dev present at build time, which is why the clippy,
# msrv and musl lanes had all been failing on `libdbus-sys` -- they build --all-features on a
# runner that has no dbus headers, and the musl static target could not have used the host's
# anyway. Vendoring fixes all three without asking every builder to install a system package.
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[features]
# The WASM token hooks dispatch (issue #114). OFF by default: it pulls wasmtime and cranelift,
# whose MSRV is 1.95 against this binary's published 1.85 (docs/COMPATIBILITY.md). A deployment
# that wants hooks builds with this and accepts 1.95 for that artifact.
#
# Making it default-on is the owner decision `ironauth-hooks`'s Cargo.toml describes, and it is
# one line here plus the two rows in COMPATIBILITY.md.
wasm-hooks = ["dep:ironauth-hooks", "ironauth-oidc/wasm-hooks"]
# Passes the optional IronBus wake-up backbone through to ironauth-store (issue #104).
ironbus = ["ironauth-store/ironbus"]
# Passes the optional IronCache accelerator backend through (issue #146). OFF by default: the
# covenant is that a deployment is COMPLETE on Postgres alone.
#
# It makes the backend SELECTABLE HERE, which is a smaller claim than the first version of this
# comment made. `--features ironauth-hot/ironcache` and `--all-features` both already compiled
# it in, from the workspace root; what this adds is the name a `-p ironauth` build can use.
# Nothing is attached either way until boot constructs a `HotState`, and nothing does.
#
# BOTH dependents are named, because both depend on `ironauth-hot` and cargo unifies features
# per crate: naming only one would still enable the backend, and the next reader would have to
# work out that it arrived through a crate the line does not mention.
ironcache = ["ironauth-oidc/ironcache", "ironauth-store/ironcache"]
# Forwarded to the server crate: OTLP trace export off by default so the
# default build and the musl static lane stay lean and protoc-free.
otlp = ["ironauth-server/otlp"]
# Enables the ironauth-store real-database harness for the DB-backed CLI integration
# test (issue #72). Test-only; adds no production surface.
#
# It also turns on the two crates' test-only OBSERVATION accessors, which the
# boot-wiring harness (issue #414) reads the assembled plane states through: the
# management plane's shared runtime objects and issuer registry, and each plane store's
# master-key handle. Each is gated on its own crate's `testing`, so nothing the harness
# needs to observe is compiled into the production binary.
testing = ["ironauth-store/testing", "ironauth-admin/testing"]

[dev-dependencies]
# The hermetic fetcher seam (issue #674). Test builds only, so no production
# binary can construct a fetcher that skips the OS trust store.
ironauth-fetch = { workspace = true, features = ["test-harness"] }
# The step-up-policy CLI integration test (issue #72) stands up a throwaway database
# (the store test-support harness), seeds a scope, drives the compiled `ironauth`
# binary as a subprocess against it, and reads the written policy back through the same
# audited repository the enforcement path reads.
ironauth-store = { workspace = true, features = ["testing"] }
ironauth-env = { workspace = true }
# The backup CLI test (issue #153) reads the restored data back through a second pool.
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# The boot-wiring harness (issue #414) derives its subject list from the serialized shape
# of `Config` itself and compares whole config sections across the two plane states as
# JSON, so a section that grows a key is compared with the new key rather than silently
# around it. Both are also REAL dependencies now (see below), so this dev entry is
# redundant rather than load-bearing; it is kept so the harness's reason stays recorded.

# The step-up-policy CLI integration test needs the store test-support harness; it is
# gated on the `testing` feature so the default build stays lean, exactly as the
# ironauth-oidc DB suites are.
[[test]]
name = "step_up_policy_cli"
required-features = ["testing"]

# The pre-upgrade preflight CLI (issue #148): drives the COMPILED `ironauth doctor`
# against a throwaway database, including the refusal to report on a role that row-level
# security applies to. Needs a real Postgres, so it is gated like the suites above.
[[test]]
name = "doctor_cli"
required-features = ["testing"]

# The rekey's lookup guard (issue #153): drives the COMPILED `ironauth storage rekey` and checks
# that a change of key MATERIAL is refused, a rename is not, and the acknowledgement gets past.
# NO feature gate and no database: the guard runs before the DSN is opened, which is itself part
# of what these assert, so they are cheap and always run. Deleting the whole refusal left every
# other test in the tree green, which is why this exists.
[[test]]
name = "rekey_cli_guard"

# The outbox retention boot suite (issue #104, PR 3) boots the COMPILED `ironauth serve`
# against a throwaway database and watches the queue. It is the only thing in the tree that
# observes the `serve` call site itself: replacing that call with a no-op left every other
# test green. Same gating as the CLI suite above.
[[test]]
name = "serve_retention_boot"
required-features = ["testing"]

# The SCIM defaults, pinned across ironauth-config and ironauth-scim (issue #135). Neither
# crate can see the other, so this is the only place the two Default impls can be compared.
[[test]]
name = "scim_settings_pin"

# The SCIM mount suite (issue #135) boots the COMPILED binary for the same reason the
# retention one does: `server.mount_public(scim_router(...))` is a single line in `serve`,
# and no in-process test can observe whether a deployed process serves that surface. The
# boot-wiring tests prove the STATE assembles; only this proves it is reachable.
[[test]]
name = "serve_scim_mount"
required-features = ["testing"]

[lints]
workspace = true

# THE DEB (issue #151 criterion 5). Built with `cargo deb -p ironauth`.
#
# The package installs the binary, a systemd unit whose hardening mirrors the Helm chart's
# pod security context, and a config file with `database.url` commented out. It does not
# start the service, and the reason is not that nothing would happen: with the URL absent
# IronAuth falls back to its built-in `postgres://ironauth@localhost:5432/ironauth`, so an
# unconfigured server would reach for a local database that is probably not there and could
# in principle be one that is.
[package.metadata.deb]
maintainer = "IronAuth maintainers <noreply@github.com>"
copyright = "The IronAuth authors"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = """A standards-first OpenID Connect identity platform in one binary. Configure /etc/ironauth/ironauth.toml, run `ironauth migrate`, then start the service."""
section = "net"
priority = "optional"
# postgresql-client is NOT a dependency: the database is normally remote, and depending on
# a client the server does not invoke would pull a package onto every host for nothing.
#
# `adduser` IS, because postinst calls it. `$auto` expands in place, so the shlibdeps result
# is kept alongside it. A maintainer script calling a binary the package does not depend on
# fails on a minimal system, which is exactly where a server package is installed.
depends = "$auto, adduser"
assets = [
    # `target/release` and NOT the musl path, even though the release lane cross-compiles.
    # cargo-deb rewrites a `target/release` asset to the target-specific directory when
    # `--target` is given, so writing the musl path here would break the plain
    # `cargo deb -p ironauth` the CI install job runs, and hard-coding either one breaks the
    # other. Leave it as the host path.
    ["target/release/ironauth", "usr/bin/", "755"],
    # A CONFFILE (see conf-files below), so dpkg preserves an operator's edits across
    # upgrades instead of overwriting the file that holds their database credential.
    ["../../packaging/debian/ironauth.toml", "etc/ironauth/ironauth.toml", "640"],
    ["../../docs/CONFIG.md", "usr/share/doc/ironauth/CONFIG.md", "644"],
]
conf-files = ["/etc/ironauth/ironauth.toml"]
maintainer-scripts = "../../packaging/debian/scripts"

[package.metadata.deb.systemd-units]
unit-scripts = "../../packaging/debian"
# NOT enabled and NOT started on install, for the reason above.
enable = false
start = false
# AND NOT RESTARTED ON UPGRADE. The default would stop the old binary and start the new one
# against the PRE-UPGRADE schema, with no migrate step between them: a new binary meeting an
# old schema is the failure the expand-contract discipline exists to avoid, and an automatic
# restart is the one place it could happen without anybody choosing it. The upgrade sequence
# is in docs/RELEASING.md: stop, migrate, start.
restart-after-upgrade = false
