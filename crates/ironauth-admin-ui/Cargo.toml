# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "ironauth-admin-ui"
version = "0.1.0"
description = "In-process serving of the IronAuth admin console single page app: rust-embed of the built dist, mounted on the public plane under /admin with a SPA fallback and its own Content Security Policy, behind the admin_spa.enabled gate (default off)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The public plane router this crate builds is merged onto the server's public
# plane via Server::mount_public, mirroring how ironauth-oidc mounts. No body
# extractors are needed (no json/query/form), so the workspace axum stays at
# default-features = false.
#
# `tokio` gates `ConnectInfo<SocketAddr>`, which the management proxy has to NAME
# in order to carry it across the extension clear the path-parameter fix requires
# (issue #90). The server installs it on both planes, and dropping it would leave a
# future IP-keyed rate limiter attributing every console request to nothing. The
# same feature is enabled in ironauth-oidc for the same extractor.
axum = { workspace = true, features = ["tokio"] }
# The same-origin management proxy (issue #90, PR 2) forwards a /admin/api/* request
# to the in-process management Router by driving it as a tower Service (oneshot). Only
# the ServiceExt utility surface is needed; no network client is pulled, so the proxy
# can target ONLY the in-process router it is handed, never an arbitrary host.
tower = { workspace = true, features = ["util"] }
# rust-embed bakes the built dist into the binary at compile time. default
# features are off (no mime-guess: content types are mapped here from the file
# extension), and debug-embed is on so the assets are always embedded rather
# than read from disk at runtime, which keeps tests independent of the working
# directory.
rust-embed = { version = "8", default-features = false, features = ["debug-embed"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
