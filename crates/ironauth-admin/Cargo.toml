path = "tests/signup_forms.rs"
required-features = ["testing"]

[[test]]
name = "sms_otp"
path = "tests/sms_otp.rs"
required-features = ["testing"]

[[test]]
name = "risk_diagnostics"
path = "tests/risk_diagnostics.rs"
required-features = ["testing"]

# Identity trait schemas over HTTP (issue #53, PR 1): the trait-schema version registry
