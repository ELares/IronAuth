# introspection read, and the CUTOVER-GATED activate that is refused while an identity fails
# the target schema), the validation wired into the user create and PATCH (a violating document
# is a 422 carrying one RFC 6901 JSON Pointer PER FIELD and writes nothing; a valid one
# persists the version it validated against and is NOT restamped by a later activation), the
# admin-only visibility split in BOTH directions (a self-service write can neither set nor
# clear admin-only metadata, while the management read still sees it), and the named Kratos
# regression: a document carrying an array of objects AND a nested object round-trips through
# create, PATCH, and export byte for byte. Needs a real database.
[[test]]
name = "trait_schemas"
path = "tests/trait_schemas.rs"
required-features = ["testing"]

# Per-environment custom-journey version management endpoint (issue #92, PR 5): the POST
