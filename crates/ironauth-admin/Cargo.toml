# multi-page cursor walk across a row a relabel touched, and the environment-scoped-key
# confinement on all five endpoints. Needs a real database (DATABASE_URL).
[[test]]
name = "permission_vocabulary"
path = "tests/permission_vocabulary.rs"
required-features = ["testing"]

[[test]]
name = "secrets"
path = "tests/secrets.rs"
required-features = ["testing"]

[[test]]
