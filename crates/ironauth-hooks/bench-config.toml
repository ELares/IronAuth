#
# The hook latency benchmark's configuration (issue #114, criterion 4).
#
# The criterion asks for cold and warm p95 "measured by the CI benchmark job on the pinned
# runner class named in the benchmark config". This file IS that config: the runner class is
# named here rather than only in the workflow, so the number a release publishes can be read
# together with the machine it was taken on.
#
# The binding is not prose. `scripts/hook-bench-gate.sh` reads BOTH this file and the workflow
# and refuses to run if the job's `runs-on` is not the class named here, so a workflow edited to
# a different machine fails instead of silently publishing numbers from somewhere else.

[runner]
# The pinned runner class. Every published number is taken on this and comparing across classes
# is meaningless: a p95 is a property of the measurement, not only of the code.
class = "ubuntu-latest"

[gates]
# The criterion's two hard bounds. The job FAILS above either.
#
# # The cold bound now measures a COMPILE, and that is a change to what criterion 4 asks
#
# The criterion says "AOT cold start p95 is below 1 ms", which assumes the request path loads a
# PRECOMPILED artifact -- deserialize, measured at 43 microseconds. Issue #114's dispatch does
# not do that, for two measured reasons: a precompiled artifact is machine code tied to the exact
# engine, wasmtime version and CPU that produced it, so putting it in a shared database is a
# portability hazard with a memory-safety failure mode; and the AOT pair measured SLOWER than the
# safe `Component::new` (34.0 ms against 32.8) while being the only `unsafe` in the crate that
# called it.
#
# So the shipped cold path compiles, once per process per artifact, and the dispatch caches the
# result. Cold is milliseconds and always would have been; what a deployment pays per login is
# WARM, which is what the microsecond claim is actually about and which this file still gates at
# the criterion's own 100 microseconds.
#
# THE 1 ms FIGURE IS THEREFORE NOT BEING ENFORCED AGAINST THE THING IT NAMED, and raising it here
# rather than silently is the point: the alternative was leaving a 1 ms gate on a path the server
# stopped taking, which is exactly the defect that made this benchmark worth nothing for one
# release. Whether the criterion should be reworded, or the design should carry precompiled
# artifacts after all, is an owner decision written up on the PR.
#
# These may be TIGHTENED here and never loosened. `scripts/hook-bench-gate.sh` carries the
# criterion's own numbers as constants and refuses a config asking it to enforce less, because
# these two lines ARE the criterion: as plain unbounded config they were one edit away from a
# gate that admits a full second, and the run still printed "clean". Lowering them as the
# runtime improves is exactly what this file is for; raising them is an edit to the script.
# 250 ms, and the 60 ms it replaces is a lesson about where a bound may be calibrated.
#
# 60 ms came from 33 ms measured on a developer laptop. The pinned runner then compiled the same
# component at 86.9 ms and the job failed on a healthy system. A ceiling derived from the machine
# that is not going to enforce it is not a ceiling.
#
# So: 86.9 ms observed on `ubuntu-latest`, and this is roughly 3x that -- wide enough that a
# slower runner in the same class does not turn the gate into noise.
#
# It does NOT catch a doubling, and an earlier version of this sentence claimed it did. 86.9 x 2
# is 174 ms, under this ceiling, so a change that doubled compile time would pass. What catches
# that is the RELATIVE check below, against a committed baseline, with its own 100% tolerance --
# this absolute number is the backstop for a collapse, not the regression detector. Saying
# otherwise was arithmetic contradicted by the same sentence's own figure.
cold_p95_micros = 250000
# UNCHANGED at the criterion's own number, and now MET on the enforcing runner -- but read the
# margin below before calling it comfortable.
#
# Four CI runs measured 83.7, 135.8, 169.9 and 168.2 us against this 100 us bound: a healthy
# system passing one run in four, which is a coin flip rather than a regression detector. The
# cause was `customize` rebuilding the entire host linker on EVERY invocation -- dozens of host
# function registrations that do not depend on the guest.
#
# The linker is now built once with the engine and each hook's imports are resolved once at load
# (`Linker::instantiate_pre`), so an invocation builds only a `Store`.
#
# ON THE RUNNER THAT ENFORCES IT, which is the only measurement that decides the criterion:
# 155.3 us before, 87.4 us after. That clears the 100 us gate, by 13%.
#
# 13% IS NOT MUCH, and an earlier version of this comment predicted better: it reasoned that the
# local 2.2x would put the whole historical CI spread (83.7 to 169.9 us) at "roughly 17 to 35
# us, entirely below the bound". The runner delivered 1.8x and 87.4 us. Scaling one machine's
# ratio onto another machine's numbers is a guess wearing a calculation, and the spread on that
# runner has been wide enough in the past to reach 100 from here.
#
# So: the criterion holds today and the RELATIVE check below is what will say whether it keeps
# holding. That is the arm this file's baseline exists for.
#
# Measured on one machine, same benchmark, THREE runs each side, with the before taken by
# checking out main's `engine.rs` rather than by stashing (stashing leaves the committed change
# in place, which is how the first attempt at this number measured the new code twice):
#
#   before   36.3, 37.3, 40.8 us
#   after    16.8, 17.0, 17.9 us
#
# So roughly 2.2x. An earlier version of this comment said "96.4 us -> 19.9 us, a 4.8x cut" and
# that does not reproduce: the 96.4 came from a different tree state, and review measured
# 35.2 -> 16.5 independently. A single-run figure written permanently into a config is a claim
# the next person cannot check, which is why the spread is here instead.
#
# The bound did not move; the distance to it did. What decides whether the criterion holds is
# the CI runner, not this machine.
warm_p95_micros = 100

[target]
# The 120-microsecond cold start the issue keeps as "a stated target, not a gate". Reported
# alongside the gate so a release can see how far from it the runtime is; never enforced.
cold_p95_micros = 120

[regression]
# How much worse than the committed baseline a run may be before the job fails.
#
# Generous on purpose. A shared CI runner is noisy and a benchmark that fails on ordinary
# variance teaches people to re-run it until it passes, which is worse than no benchmark: the
# gates above are the real bound, and this catches a step change rather than a drift.
tolerance_percent = 50

# The ceiling on the line above lives in `scripts/hook-bench-gate.sh`, NOT here.
#
# It was here, as `max_tolerance_percent`, and that was the same defect one level out: two
# adjacent lines in one file, both editable together, so setting both to 1e9 admitted a 12400%
# regression and printed "clean". A bound in the same artifact as the thing it bounds is not a
# bound. The script's `MAX_TOLERANCE_PERCENT` is what refuses a looser value.

[samples]
# The FLOORS on how many samples a published p95 may rest on.
#
# The benchmark reports its iteration counts and nothing read them, so `COLD_ITERATIONS` could
# fall from 200 to 1 -- making the "p95" a single sample -- invisibly to the gate and to the
# baseline it is compared against. A number is only comparable to another number taken the same
# way, and the sample count is part of "the same way".
#
# Raisable here, never lowerable: as plain config these were floors that could themselves be set
# to zero, which is a floor made of nothing.
min_cold_iterations = 200
min_warm_iterations = 5000
