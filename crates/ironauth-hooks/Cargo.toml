# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "ironauth-hooks"
version = "0.1.0"
description = "In-process WASM component hooks for IronAuth: a deny-by-default capability sandbox with fuel, deadline, and memory bounds"
edition.workspace = true
# The optional WASM hook runtime requires Rust 1.96 through Wasmtime 49 and
# Cranelift. Default builds retain the workspace Rust 1.88 minimum; enabling
# wasm-hooks requires this higher compiler version. The compatibility gate
# checks the complete optional-feature graph with this toolchain.
rust-version = "1.96"

license.workspace = true
repository.workspace = true

[dependencies]
sha2.workspace = true
# The WASM runtime (issue #114). Apache-2.0 WITH LLVM-exception, which the licence policy
# already allows. Its MSRV is 1.96, ABOVE the workspace promise of 1.88, which is why this
# crate carries its own `rust-version` above and why the msrv lane scopes itself to what the
# shipped binary reaches.
#
# `cranelift` is the compiling backend and is what makes AOT precompilation possible; the
# runtime never compiles a hook on the request path, only deserializes what deployment
# already compiled. See `engine.rs` for why that distinction is a security boundary and
# not just a latency one.
wasmtime = { version = "=49.0.1", default-features = false, features = [
    "component-model",
    "cranelift",
    "runtime",
    "std",
] }
# The WASI host implementations. Only fourteen of its interfaces are ever added to a
# linker; see `sandbox.rs` for the list and for what is deliberately left out. The count is
# documentation; what actually pins the sandbox are the escape fixtures in guests/, one per
# absent capability family, each asserted to fail at instantiation.
wasmtime-wasi = "=49.0.1"
wasmtime-wasi-io = "=49.0.1"

[dev-dependencies]
# For ONE test: that calling `customize` from a tokio worker thread panics. That is a real
# constraint on the dispatch and the doc comment used to say a `#[test]` fn could not observe
# it, which was wrong -- a test can build its own runtime. An executable warning outlives a
# written one: if someone swaps the sandbox to wasmtime-wasi's async bindings, this goes red and
# the doc comment gets corrected with it.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# The latency benchmark (issue #114, criterion 4). `harness = false` because it emits JSON for
# a gate script rather than running libtest: a benchmark whose output only a human reads cannot
# fail a build, and the criterion asks for a job that fails on regression.
[[bench]]
name = "hook_latency"
path = "benches/hook_latency.rs"
harness = false

# The shipped guest fixtures, as bytes, for a test in ANOTHER crate.
#
# `IRONAUTH_GUEST_GOOD` and its siblings are set by this crate's build script, so only this
# crate can `include_bytes!` them. The dispatch that runs a hook lives in `ironauth-oidc`, and
# the test that matters -- M11's exit criterion, a WASM hook customizing a real token -- has to
# drive a real component through a real issuance. Exporting the bytes is what lets that test
# live where the code it tests lives.
#
# Behind a feature so the fixtures are not in a release binary: they are test data, and a
# claim-shaping guest compiled into the server would be several hundred kilobytes of
# never-executed WASM.
[features]
testing = []

[lints]
workspace = true
