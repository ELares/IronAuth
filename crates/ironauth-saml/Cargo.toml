# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "ironauth-saml"
version = "0.1.0"
description = "IronAuth hostile-input SAML harness: the single choke point through which SAML XML may enter, with DTDs and external entities structurally impossible, size and depth bounds, and an API that offers no way to read an attribute from a document nobody has verified"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# THE ONE XML LIBRARY. See the crate doc for the evaluation and the rejected
# alternatives. Default features OFF: `quick-xml` gains nothing here from
# serialisation or async, and every feature is a parser surface this crate would
# then have to reason about.
quick-xml = { workspace = true }
# THE SIGNATURE PRIMITIVE LIVES IN `ironauth-jose`, and this crate calls it. `jose-audit.sh`
# allows exactly one crate a direct dependency on the crypto backend, and its argument applies
# here unchanged: a second crate reaching for the same primitives is a second verifier. This
# crate owns the XML -- what a SignedInfo is, which transforms are allowed, how a subtree
# canonicalises, every wrapping refusal -- and jose owns the two lines where bytes meet a key.
ironauth-jose.workspace = true
# THE OUTBOUND DIRECTION ONLY (issue #139). The HTTP-Redirect binding carries a base64 payload,
# and this crate encodes one it built rather than decoding one it was given -- the inbound ACS
# does its own decoding at the transport layer, before anything here sees a byte.
base64.workspace = true
# THE SHARED DER READER, for the ONE place this crate meets DER: a certificate an operator
# uploads at the management surface. It is `ironauth-webauthn`'s former `src/der.rs`, moved out
# rather than copied, because two DER readers in a codebase is two answers to what a certificate
# says and an attacker picks which one to reach.
ironauth-der.workspace = true

[dev-dependencies]
# trybuild drives the compile-fail proof that a value cannot be read out of an
# unverified document, which is the shape `ironauth-jose` uses for the same job.
trybuild.workspace = true
# THE ENTROPY SEAM, for generating the RSA key the AuthnRequest suite signs with. A dev
# dependency because the crate itself never generates a key: it signs with one the caller loaded.
ironauth-env.workspace = true
# AN XML PARSER THE METADATA WRITER DOES NOT GO THROUGH, so the suite can assert the document it
# emits is well-formed rather than assert that its own byte-building agrees with itself. A regular
# dependency is not reachable from an integration test, which is why it is repeated here.
quick-xml = { workspace = true }

[features]
default = []
# Exposes the canonicalizer to its own test suite, and nothing else. See the module's doc for
# why that suite cannot go through the verifier.
test-util = ["ironauth-jose/test-util"]

[lints]
workspace = true
