# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "ironauth-scim"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SCIM 2.0 inbound server surface for IronAuth (issue #135): the RFC 7644 filter grammar and its typed representation."

[lints]
workspace = true

[features]
# The reference downstream SCIM server used to test the OUTBOUND client (issue #137).
# Test scaffolding only; never enabled by a release build.
downstream-fixture = []

[dependencies]
ironauth-store = { path = "../ironauth-store" }
ironauth-env = { path = "../ironauth-env" }
axum = { workspace = true, features = ["json", "query"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
ironauth-store = { path = "../ironauth-store", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower.workspace = true
serde_json.workspace = true


# THE SCIM SURFACE (issue #135): that no route answers without a credential, that a token
# cannot be repointed at another scope by editing the half that names one, and that the
# discovery documents report what the server enforces. Needs a database.
[[test]]
name = "surface"
path = "tests/surface.rs"

# THE USERS RESOURCE (issue #135): that every method authenticates, that a credential reaches
# exactly its own organization through every path shape, filter and encoding, and that both
# vendor PATCH dialects actually deactivate. Needs a database.
#
# The cross-scope IDOR suite is tests/idor.rs, which needs no block of its own -- this crate
# leaves `autotests` on, so it is discovered.
[[test]]
name = "users"
path = "tests/users.rs"

# GROUP PUSH (issue #135): the three PATCH shapes an identity provider actually sends, each
# asserted on the membership read back rather than on the status; that a group cannot hold
# another organization's user through any member-carrying door; and the slug derivation.
# Needs a database.
[[test]]
name = "groups"
path = "tests/groups.rs"

# THE REFERENCE DOWNSTREAM (issue #137): the fixture the outbound client is measured against,
# tested itself so that a client suite driving it cannot pass for the wrong reason. No database.
[[test]]
name = "downstream_fixture"
path = "tests/downstream_fixture.rs"
required-features = ["downstream-fixture"]
