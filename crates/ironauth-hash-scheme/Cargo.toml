# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "ironauth-hash-scheme"
version = "0.2.0"
description = "Algorithm-tagged verification of foreign password hashes (bcrypt, Argon2, scrypt, PBKDF2, Firebase modified scrypt), with import-time cost bounds"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ironauth-hash-scheme"
keywords = ["password", "bcrypt", "argon2", "scrypt", "migration"]
categories = ["authentication", "cryptography"]

# This crate depends on NO ironauth-* crate, deliberately, and that is the whole point
# of it existing separately (issue #55): it is the one layer of the import path that is
# useful to somebody who is not running IronAuth, and it is the only one that can be
# published on its own. Adding an ironauth-* dependency here would silently revoke that,
# so the absence of a `[dependencies]` entry naming one is load-bearing.
[dependencies]
aes = "0.9"
argon2.workspace = true
base64.workspace = true
bcrypt = "0.19"
ctr = "0.10"
password-hash = "0.5"
pbkdf2 = { version = "0.12", features = ["simple", "sha2"] }
scrypt = "0.11"
sha-crypt = "0.6"
sha1.workspace = true
sha2.workspace = true
subtle = "2"

# THE PEDANTIC LINTS, which this crate was the only one in the workspace missing.
#
# Nineteen crates carry `[lints] workspace = true`; this one did not, so `clippy::pedantic`
# and `missing_docs` never ran on the published crypto crate while every gate reported
# "pedantic clippy clean". That is the same hollow-claim shape as citing `bans ok` on an
# axis `deny.toml` sets to `warn`. Measured before adding it: the crate is clean under
# pedantic anyway, so nothing was hiding behind the omission.
[lints]
workspace = true
