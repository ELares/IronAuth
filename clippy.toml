doc-valid-idents = ["IronAuth", "IronCache", "IronBus", "OpenID", "OAuth", "OpenAPI", "RateLimit", "GitHub", "PostgreSQL", "WebAuthn", "FedCM", "IdP", "JavaScript", "TypeScript", ".."]

# The cost budget is only a budget if it cannot be walked around.
#
# `ironauth-cel` refuses an expression whose estimated cost exceeds the budget and returns a
# `BudgetedProgram` that carries the shape it was budgeted against. A caller that reaches
# `cel::Program::compile` directly gets an unbudgeted program it can evaluate against any
# input at all, which is issue #113 criterion 2 defeated in one line -- and defeated silently,
# because the expression still works.
#
# The crate itself is the one place that must call it, and it does so behind an
# `#[expect(clippy::disallowed_methods)]` with the reason attached, so the exemption is a
# reviewable line rather than an absence.
# FOUR routes, not one. Review built a scratch crate carrying only the `Program::compile`
# entry and measured that `cel::Program::try_from(src)`, `let p: cel::Program = src.try_into()`
# and `cel::Value::resolve(&Parser::default().parse(src), &Context::default())` were all
# SILENT -- `TryFrom<&str> for Program` (cel-0.14.3/src/lib.rs:213) calls `compile` internally,
# and a path-based lint cannot see through to a different DefId. Naming the TYPES closes the
# constructor routes; naming `resolve` closes the one that never mentions `Program` at all.
disallowed-methods = [
    { path = "cel::Program::compile", reason = "compile through ironauth_cel::compile_within_budget, which refuses an expression whose cost exceeds the budget; calling this directly yields an unbudgeted program (issue #113 criterion 2)" },
    { path = "cel::Value::resolve", reason = "evaluate through ironauth_cel::BudgetedProgram::evaluate, which enforces the declared input shape; resolving a parsed expression directly skips both the budget and the shape (issue #113 criterion 2)" },
]

disallowed-types = [
    { path = "cel::Program", reason = "hold an ironauth_cel::BudgetedProgram instead: it carries the shape it was budgeted against, and a bare Program can be evaluated against anything (issue #113 criterion 2)" },
    { path = "cel::parser::Parser", reason = "parse through ironauth_cel::compile_within_budget; a directly parsed expression has no cost estimate attached (issue #113 criterion 2)" },
]
