# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Supply-chain policy for IronAuth (https://embarkstudios.github.io/cargo-deny/).
# Mirrors the sibling Iron projects: permissive licenses only, no wildcard
# dependencies, advisories are build failures, crates.io is the only source.
# Every exception added here must carry a reason and an issue reference.

[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
# Scoped exceptions (issue #86): the vetted allowlist HTML sanitizer `ammonia`, the
# security core of safe branding rich text, pulls `cssparser` and its `dtoa-short`
# helper, both Mozilla-authored and MPL-2.0. MPL-2.0 is a weak, file-scoped copyleft
# that imposes no obligation on the rest of the tree; these two crates are used
# unmodified. The exception is pinned to EXACTLY these crates rather than allowing
# MPL-2.0 platform-wide, so no other MPL crate can enter unnoticed.
exceptions = [
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  # BSL-1.0 is the Boost licence: OSI approved, permissive, and no reciprocity, so it asks
  # LESS of us than the MPL-2.0 exceptions above. Pinned to this crate for the same reason
  # they are: the point of an exception list is that the next arrival is noticed.
  # Reached transitively through sqlx-postgres, not chosen.
  { crate = "xxhash-rust", allow = ["BSL-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"
# Scoped advisory ignore (issue #93). RUSTSEC-2023-0071 ("Marvin Attack") is a
# TIMING side channel in the `rsa` crate's RSA DECRYPTION path (PKCS#1 v1.5
# unpadding). IronAuth uses the `rsa` crate ONLY to GENERATE a day-one RS256
# signing key and export it to PKCS#1 DER (crates/ironauth-jose keygen); it never
# decrypts and never signs with the `rsa` crate. Signing and verification run
# exclusively on `ring`. The vulnerable decryption path is therefore UNREACHABLE
# in this tree. There is no fixed release of `rsa` for this advisory yet, so the
# only options are ignore-with-justification or vendoring keygen; the former is
# correct given the path is unreachable. The dep-review lens MUST re-confirm the
# `rsa` crate is never used to decrypt or sign before this ignore is trusted.
# Scoped advisory ignore (issue #959). RUSTSEC-2026-0009 is a stack-exhaustion DoS
# in `time`'s parser, fixed in 0.3.47. This tree holds `time` at 0.3.41 and cannot
# take the fix: 0.3.47 declares `rust-version = "1.88"` and this workspace promises
# 1.85, so the two constraints are mutually exclusive until the MSRV moves.
#
# The path is UNREACHABLE in anything shipped. `cargo tree -i time --all-features`
# shows exactly one route into the graph: rcgen -> ironauth-fetch. rcgen is an
# OPTIONAL dependency enabled only by ironauth-fetch's non-default `test-harness`
# feature, which exists so a test can mint a throwaway TLS identity. No default
# build of any crate in this workspace reaches `time` at all, so no released binary
# links the vulnerable parser, and nothing parses attacker-supplied input with it:
# rcgen uses it to stamp certificate validity dates on material generated in-process
# by the test itself.
#
# Re-confirm before trusting this ignore: `cargo tree -i time --all-features` must
# still show rcgen as the only path, and rcgen must still be optional and
# test-harness-gated in crates/ironauth-fetch/Cargo.toml. If either changes, or if
# the MSRV moves to 1.88, drop this entry and take time >= 0.3.47.
# Scoped advisory ignore (issue #113). RUSTSEC-2024-0436 is an UNMAINTAINED notice, not a
# vulnerability, against `paste` -- a COMPILE-TIME proc macro that pastes identifiers
# together and contributes no runtime code to any binary. It reaches this workspace through
# exactly one path: ironauth-cel -> cel 0.12.
#
# `cel` 0.13 and 0.14 drop it for `pastey`, the maintained fork of the same macro, and both
# declare `rust-version = "1.86.0"`. ironauth-cel is reachable from the shipped binary now,
# so taking either would make the PRODUCT MSRV 1.86 against the 1.85 promised in
# docs/COMPATIBILITY.md. That is the same MSRV-versus-advisory conflict the `time` entry
# below records, resolved the same way and on weaker grounds than that one: this advisory
# describes maintenance status rather than a defect, and the crate is not in the binary.
#
# Re-confirm before trusting this ignore: `cargo tree -i paste` must still show cel as the
# only path. If the MSRV promise moves to 1.86 or above, drop this entry and take cel 0.14.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is UNMAINTAINED, not vulnerable, and is a compile-time proc macro contributing no runtime code. It reaches the graph only through cel 0.12, which is pinned below 0.13/0.14 because those declare rustc 1.86 against this workspace's 1.85 MSRV promise. Drop this and take cel 0.14 when the MSRV moves." },
    { id = "RUSTSEC-2023-0071", reason = "rsa crate used only for RS256 keygen + DER export (crates/ironauth-jose); never decrypts or signs, so the Marvin decryption-timing path is unreachable. Signing/verification is on ring." },
    { id = "RUSTSEC-2026-0009", reason = "time 0.3.41 reaches the graph ONLY through rcgen, an optional dependency behind ironauth-fetch's non-default test-harness feature; no default build links it, so the parser DoS is unreachable in any released artifact. The fix (0.3.47) requires rustc 1.88 against this workspace's 1.85 MSRV promise." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# ONE git source, and it is a repository we publish from ourselves.
#
# RUSTSEC-2026-0041 reaches this workspace only through ironbus-core -> lz4_flex 0.10.0.
# Nothing here declares lz4_flex, so the fix had to happen in IronBus (ELares/IronBus#1203,
# bumping to the patched 0.11.6); the `[patch.crates-io]` block in the workspace Cargo.toml
# points at that commit until a release carries it.
#
# The alternative was an advisory ignore, and this is the better trade: an ignore asserts a
# reachability nobody measured and stays silently true forever, while this makes the
# workspace actually run patched code and leaves a `[patch]` block that is obvious in every
# `cargo update`.
#
# THIS ENTRY ALLOWS THE REPOSITORY, NOT A COMMIT. What pins the code is the `rev` in the
# patch block; this line only says the host is one we control. Both come out together the
# moment ironbus-core publishes a version carrying the bump (ELares/IronAuth#892).
allow-git = ["https://github.com/ELares/IronBus"]
