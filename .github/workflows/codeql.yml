# SPDX-License-Identifier: MIT OR Apache-2.0
name: CodeQL

# Scan every proposed change and every main commit, including documentation changes.
# The weekly run also picks up new security queries against unchanged source.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "15 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded PR scans can stop; each main push must retain its own scan.
  group: codeql-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust fixture target
        if: matrix.language == 'rust'
        # Rust extraction runs build scripts and macro code. The hooks build script
        # compiles its fixtures for this target even without a full workspace build.
        # rustup honors the repository's pinned rust-toolchain.toml.
        run: rustup target add wasm32-wasip2

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Match the patched Go toolchain used for provider vulnerability checks.
          go-version: "1.25.14"
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Analyze and upload SARIF
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
