# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Per-artifact release automation for the ironauth server binary. Trigger:
# push a tag "ironauth-vX.Y.Z" whose version equals crates/ironauth's
# Cargo.toml version (the job verifies and refuses on mismatch). Other
# artifacts (SDKs, SPA) get their own "<artifact>-vX.Y.Z" lanes when they
# land. Produces: a static musl binary, a CycloneDX SBOM, GitHub build
# provenance attestations, a packaged Helm chart with an SBOM of the images it
# deploys, a DEB with its SBOM bound to it, a GitHub release with the crate
# changelog section, and a cosign-signed container image on GHCR carrying both a
# provenance attestation and an SBOM. First real release validates
# this lane end to end; see docs/RELEASING.md.
name: release

on:
  push:
    tags:
      - "ironauth-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify:
    name: verify tag matches crate version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: tag equals crates/ironauth version
        run: |
          tag_version="${GITHUB_REF_NAME#ironauth-v}"
          crate_version=$(grep -m1 '^version' crates/ironauth/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag_version crate=$crate_version"
          test "$tag_version" = "$crate_version"
      # NO SEPARATE CHART-VERSION CHECK, deliberately, and this is where someone would add
      # one. `scripts/helm-chart.sh` already fails on main when Chart.yaml `appVersion`
      # differs from the crate version, and the tag equals the crate version by the step
      # above, so tag == appVersion holds transitively with nothing new to run. The chart's
      # default image tag falls back to appVersion, so that is the field that decides which
      # server a chart installs.
      #
      # Chart.yaml `version` is NOT tied to the tag: its own comment says it is bumped when
      # the chart changes, independently of the appVersion it deploys, and that is ordinary
      # Helm practice. A release-time assertion that it equals the tag would fail a release
      # AFTER the tag was pushed, for following the instruction the file itself gives.
      # Issue #114 criterion 4 asks for the hook latency numbers to be "published per release".
      # Checked HERE rather than beside the asset copy, and the reason is what happens if it is
      # not: the build job attests build provenance to a public transparency log BEFORE it
      # reaches the asset list, so a missing file there leaves a pushed tag and a published
      # attestation with no release behind it. A precondition of releasing belongs in the job
      # that runs before anything is signed.
      - name: the hook latency baseline exists and says something
        # `-s` alone was the first version, and a one-byte junk file satisfies it -- which would
        # publish that byte as `hook-latency.json`, hash it into SHA256SUMS, and call the
        # criterion met. The keys are checked because they are what makes the file an ANSWER to
        # "what was this measured at, and on what".
        run: |
          python3 - <<'CHECK'
          import json, pathlib, sys

          path = pathlib.Path("crates/ironauth-hooks/bench-baseline.json")
          if not path.is_file() or path.stat().st_size == 0:
              print(f"{path} is missing or empty.", file=sys.stderr)
              print("It is a release asset (issue #114 criterion 4: numbers published per", file=sys.stderr)
              print("release). The hook-bench CI job prints the exact contents to commit on", file=sys.stderr)
              print("its first run against a given machine.", file=sys.stderr)
              sys.exit(1)
          try:
              baseline = json.loads(path.read_text(encoding="utf-8"))
          except json.JSONDecodeError as error:
              print(f"{path} is not JSON: {error}", file=sys.stderr)
              sys.exit(1)
          required = ("runner_class", "machine", "cold_p95_micros", "warm_p95_micros")
          missing = [key for key in required if not baseline.get(key)]
          if missing:
              print(f"{path} is missing {missing}.", file=sys.stderr)
              print("A published figure with no machine beside it is not a measurement.", file=sys.stderr)
              sys.exit(1)
          CHECK

  build:
    name: build, sbom, attest, release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install musl target for the pinned toolchain
        run: rustup target add x86_64-unknown-linux-musl
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl -p ironauth
      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --spec-version 1.5
      # THE CHART, packaged as a release artifact (issue #151 criterion 4). It was not
      # published at all, so "every release artifact has an SBOM and provenance" was vacuous
      # for it: there was no artifact to attest.
      # PINNED TO THE VERSION THE GATE USES. `scripts/helm-chart.sh` runs under v3.16.3 in
      # ci.yml, and an unpinned action would package the shipped chart with whatever major is
      # current, so the binary that validates the chart and the binary that packages it could
      # differ across a major release boundary.
      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Package the Helm chart
        run: helm package charts/ironauth --destination .
      # THE CHART'S COMPONENTS ARE THE IMAGES IT DEPLOYS, and nothing else in it is a
      # dependency: the rest is templates.
      #
      # A syft directory scan was the first version of this step and it was wrong. Syft has
      # no cataloger that matches a Helm chart, so it would have emitted a CycloneDX document
      # with an empty `components` array, published it as the chart's SBOM, and satisfied
      # "every artifact has an SBOM" with a file that says nothing. An empty SBOM is worse
      # than an absent one: it answers the question a consumer asks.
      #
      # So the components come from the RENDERED chart, which is the only place the image
      # reference is resolved (`values.image.tag` defaults to `.Chart.AppVersion`).
      - name: SBOM for the chart
        run: |
          helm template ironauth charts/ironauth \
            | grep -oE '^[[:space:]]+image: "?[^"]+"?' \
            | sed -E 's/^[[:space:]]+image: "?//; s/"?$//' \
            | sort -u > chart-images.txt
          test -s chart-images.txt
          python3 - <<'SBOM'
          import json, pathlib
          images = [l.strip() for l in pathlib.Path("chart-images.txt").read_text().splitlines() if l.strip()]
          doc = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.5",
              "version": 1,
              "metadata": {"component": {"type": "application", "name": "ironauth-chart"}},
              "components": [
                  {"type": "container", "name": i.rsplit(":", 1)[0],
                   "version": i.rsplit(":", 1)[1] if ":" in i else "unknown",
                   "purl": f"pkg:oci/{i.rsplit('/', 1)[-1]}"}
                  for i in images
              ],
          }
          pathlib.Path("ironauth-chart.cdx.json").write_text(json.dumps(doc, indent=2))
          SBOM
          # AN SBOM WITH NO COMPONENTS MUST NOT SHIP. This is the assertion the syft version
          # would have failed, and the reason this step is written out rather than delegated.
          python3 -c "import json,sys; d=json.load(open('ironauth-chart.cdx.json')); sys.exit(0 if d['components'] else 1)"
          cat ironauth-chart.cdx.json
      # THE DEB (issue #151 criteria 4 and 5). Built from the SAME BUILD as the tarball
      # rather than a second compile, so the two cannot drift.
      #
      # Not byte-identical: cargo-deb strips the binary it packages, which is what a package
      # should ship. The claim worth making is same-build, and that is the one made here.
      - name: Build the DEB
        run: |
          cargo install cargo-deb --locked --version '^2'
          cargo deb -p ironauth --target x86_64-unknown-linux-musl --no-build
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/ironauth dist/ironauth-x86_64-linux-musl
          cp target/x86_64-unknown-linux-musl/debian/ironauth_*.deb dist/
          cp ironauth-*.tgz dist/
          # NOT copied explicitly: the `find` below already stages every *.cdx.json in the
          # workspace, this one included. Copying it here AND listing it in the release args
          # handed `gh release create` the same basename twice, and GitHub rejects a
          # duplicate asset name with a 422 that is not retried. That failure would land on
          # the LAST step of this job, after the release exists and the provenance
          # attestations are already in the public transparency log.
          find . -name '*.cdx.json' -not -path './dist/*' -exec cp {} dist/ \;
          # The config JSON schema drives editor autocomplete for operators and
          # is freshness-checked in CI (scripts/config-schema.sh); ship it as a
          # release asset so it is downloadable per version alongside the binary.
          cp docs/config-schema.json dist/config-schema.json
          # The hook latency numbers (issue #114 criterion 4). Staged BEFORE the manifest below,
          # because an asset added after `sha256sum *` is the one asset a downloader cannot
          # verify -- which is a worse outcome than not publishing it.
          cp crates/ironauth-hooks/bench-baseline.json dist/hook-latency.json
          cd dist && sha256sum * > SHA256SUMS
      # BOTH ARTIFACTS, not just the binary. #151 criterion 4 asks for provenance on every
      # release artifact, and a DEB published beside an attested binary but carrying no
      # attestation of its own is the asset a verifier cannot check.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/ironauth-x86_64-linux-musl
            dist/ironauth_*.deb
            dist/ironauth-*.tgz
      # THE DEB'S SBOM, BOUND TO THE DEB. The PR that added the package said its SBOM was
      # covered "via the binary's", which was an argument rather than a link: nothing
      # associated the crate document with the .deb, so a consumer holding the package had no
      # attestation to check. The package contains that binary plus a unit file and a config,
      # neither of which is a dependency, so the crate graph IS its component list.
      - name: Attest the DEB SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: dist/ironauth_*.deb
          sbom-path: crates/ironauth/ironauth.cdx.json
      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#ironauth-v}"
          awk -v ver="$version" '/^## /{p=($0 == "## " ver)} p' crates/ironauth/CHANGELOG.md > dist/RELEASE_NOTES.md
          test -s dist/RELEASE_NOTES.md || echo "See crates/ironauth/CHANGELOG.md" > dist/RELEASE_NOTES.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/ironauth-x86_64-linux-musl dist/SHA256SUMS dist/config-schema.json dist/*.cdx.json \
            dist/hook-latency.json dist/ironauth_*.deb dist/ironauth-*.tgz

  image:
    name: container image, signed
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install musl target for the pinned toolchain
        run: rustup target add x86_64-unknown-linux-musl
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl -p ironauth
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: push
        run: |
          version="${GITHUB_REF_NAME#ironauth-v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ironauth"
          mkdir -p image-build
          cp target/x86_64-unknown-linux-musl/release/ironauth image-build/
          # ONE COMMITTED DOCKERFILE, shared with the cluster job in ci.yml. These were two
          # heredocs and they had drifted: the other copy omitted `USER 65532:65532`.
          cp deploy/Dockerfile image-build/Dockerfile
          docker build -t "$image:$version" -t "$image:latest" image-build
          docker push "$image:$version"
          docker push "$image:latest"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image:$version" | cut -d@ -f2)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        run: cosign sign --yes "${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}"
      # THE SIGNATURE IS CHECKED HERE, by the same script docs/RELEASING.md tells a
      # consumer to run (issue #151 criterion 3). Signing without ever verifying
      # publishes a signature nobody has confirmed is checkable: a wrong identity, a
      # misconfigured issuer or an unpushed signature all look identical from the
      # signing side, and the first person to find out would be a user.
      #
      # It runs the exact tag, so this asserts the image carries a signature from THIS
      # release rather than from any release.
      - name: Verify the signature we just published
        run: scripts/verify-image.sh "${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}" "$GITHUB_REF_NAME"
      # THE COMMAND THE DOCS HAND A CONSUMER, run against the same image.
      #
      # The step above passes the exact tag, which exercises the
      # --certificate-identity branch. The default invocation in
      # docs/RELEASING.md passes no tag and takes the --certificate-identity-regexp
      # branch instead, and nothing ran it: the pattern a consumer is told to
      # trust was the one path CI never took.
      - name: Verify again the way a consumer is told to
        run: scripts/verify-image.sh "${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}"
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # AN SBOM FOR THE IMAGE (issue #151 criterion 4), and it is the BINARY'S dependency
      # graph rather than a container scan.
      #
      # The first version of this step ran syft against the pushed digest and justified it by
      # saying the image "carries whatever its base layer brings". The image is `FROM scratch`
      # forty lines above: there is no base layer, and the only thing in it is one static
      # binary with no package metadata for syft to catalog. That scan would have produced a
      # CycloneDX document with an empty `components` array and attested it to the registry as
      # the image's SBOM. An empty SBOM is worse than an absent one, because it answers the
      # question a consumer asks.
      #
      # This job already compiles the same binary the image contains, so the accurate answer
      # is the crate graph, generated here rather than passed between jobs.
      - name: SBOM for the image
        run: |
          cargo install cargo-cyclonedx --locked
          # No package filter: `cargo cyclonedx` takes none, and `-- -p ironauth` exits 2.
          # It writes one document per crate, named `<crate>.cdx.json` beside that crate's
          # manifest. Verified locally: crates/ironauth/ironauth.cdx.json, 349 components.
          cargo cyclonedx --format json --spec-version 1.5
          cp crates/ironauth/ironauth.cdx.json image.cdx.json
          # AN SBOM WITH NO COMPONENTS MUST NOT BE ATTESTED. This is the assertion the syft
          # version would have failed.
          python3 -c "import json,sys; d=json.load(open('image.cdx.json')); sys.exit(0 if d.get('components') else 1)"
      - name: Attest the image SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: image.cdx.json
          push-to-registry: true

  bench:
    name: benchmark harness
    needs: verify
    runs-on: ubuntu-latest
    # The two benchmarks here are release builds with no warm cache. ci.yml budgets 60 for the
    # hook benchmark alone, so 45 was optimistic.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # THE HARNESS IS ONE COMMAND. Issue #152 criterion 2 asks that the published numbers
      # reproduce from a clean checkout with one documented command and that CI run it per
      # release. Before this job, both benchmarks backing the published documents ran nowhere:
      # the unit-costs example was compiled by `--all-targets` and never executed, and the
      # startup/RSS script appeared in no workflow and no gate.
      #
      # It does not gate the release on the numbers. See scripts/bench.sh: a benchmark is not
      # reproducible across hardware, so a threshold checked here would either fail on a
      # runner that is not the machine the table was written on, or be widened until it means
      # nothing. The harness fails when a benchmark could not RUN, and on CI it also fails
      # when one of the doc-backed benchmarks SKIPS, so a partial result set cannot report
      # success.
      #
      # Hook latency is not run here and needs none of this job's provisioning. It is a gate
      # pinned to the `hook-bench` job's runner class, enforced by that job on every push to
      # main and every pull request, and it backs no published document.
      - name: Locate the runner's Postgres binaries
        id: pg
        run: |
          set -euo pipefail
          # The image ships a client and at least one server version; take the newest bin
          # directory that actually has initdb, since scripts/startup-rss-bench.sh initdb's
          # and starts its own throwaway cluster rather than using a service container, and a
          # client-only directory would fail at that step rather than here.
          for d in $(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -Vr); do
            if [ -x "$d/initdb" ]; then echo "dir=$d" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "::error::no Postgres bin directory with initdb on the runner"
          exit 1
      - name: Run the benchmark harness
        run: PG_BIN='${{ steps.pg.outputs.dir }}' scripts/bench.sh
      # PUBLISHED SEPARATELY FROM THE RELEASE ASSETS. These are measurements of one shared CI
      # runner, not artifacts anyone should install, and the sizing guide criterion 4 asks for
      # has to be measured on the instance classes it recommends.
      - name: Archive the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: target/bench/
          # The harness creates target/bench and writes SUMMARY.txt before it can exit
          # nonzero, so an empty upload means the step never reached the harness at all.
          if-no-files-found: error
          retention-days: 90
