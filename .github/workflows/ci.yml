# SPDX-License-Identifier: MIT OR Apache-2.0
#
# The merge gate. Every lane here is required before merge once branch
# protection lists them; scripts/gate.sh runs the locally runnable subset in
# the same order. Lanes: fmt, clippy (pedantic, -D warnings), test, msrv,
# musl static build, cargo-deny, invariant lints (including the conformance
# harness static checks), dash scan, compat matrix.
#
# The OIDF conformance harness (issue #37) is split in two on purpose:
#   - its STATIC half runs in the `invariants` job on every PR, gated by no
#     repository variable, and is a real required check today;
#   - its LIVE half (`conformance-live`) needs an owner-provisioned suite runner.
#     That job always RUNS but is explicitly ADVISORY and named so it cannot be
#     mistaken for a gate: it is not gated by a job-level `if:`, because GitHub
#     reports a skipped job to branch protection as SUCCESS, which would let one
#     unset repository variable turn a required conformance check silently green.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (pedantic, -D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install the WASM target for the pinned toolchain
        # `ironauth-hooks` builds its guest fixtures for wasm32-wasip2 from a build script,
        # so every job that compiles the workspace needs the target. Added through rustup
        # rather than the action's `targets:` input for the reason the musl job records:
        # rust-toolchain.toml pins the toolchain cargo actually uses, and the action only
        # equips its own.
        #
        # The fixtures are not optional and are deliberately not skippable. They are the
        # hooks that spin, allocate, and try to open a socket, and without them the sandbox
        # tests verify nothing while still reporting green.
        run: rustup target add wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    # MEASURED, not guessed, and the previous value was neither.
    #
    # The first run of this job that did not die on disk exhaustion instead hit the
    # 45-minute ceiling with the suite still running: compile finished at 4m09s and the
    # test phase had consumed 37.5 minutes without reaching the end. So no run in the
    # recorded history has ever COMPLETED this suite, and the true wall-clock cost is
    # still unknown -- which is exactly why the ceiling has to be generous rather than
    # tight. 90 leaves room for a complete run to be measured for the first time; the
    # honest next step is to read the duration off a green run and bring this down to it.
    #
    # STILL UNPROVEN, and this branch's own run says by how much: job 96119283012 ran the
    # tests step for 55m36s and died at `absent_scope`, which is `ironauth-store` target 1 of
    # 88. So 238 non-store binaries plus one store binary cost 55.6 minutes, and the 87
    # remaining store targets, the database-dense ones, plus the doctests are unmeasured. 90
    # is room to find out, not a figure anyone has confirmed fits.
    timeout-minutes: 90
    # The ironauth-store isolation tests (rls, idor, repository) require a real
    # Postgres. The harness creates a fresh per-run database and provisions the
    # low-privilege application role, so it needs a superuser/owner connection;
    # this service provides one. Without DATABASE_URL those tests fail loudly
    # (never silently skip), so this wiring is what proves isolation against a
    # real database on every run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # The default 64MB /dev/shm exhausts the Postgres dynamic-shared-memory
        # segments (error 53100) under the growing parallel test suite, where every
        # test spins up an isolated database. Give the container a larger shm.
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The Postgres above is a per-job SERVICE CONTAINER, created fresh for this job and
      # destroyed with it, so the cluster-wide sweep cannot reach anything but this job's own
      # databases.
      #
      # EVERY store binary drives that sweep, not one test: `TestDatabase::start` runs it once
      # per process from over a hundred test files, all of them under the override below. So
      # the marker is read in `reclaim_min_age_secs`, and any binary whose threshold has been
      # LOWERED refuses without it. `with-test-db.sh` sets it for a cluster it creates itself
      # and deliberately does NOT set it when you pass your own DATABASE_URL, because on that
      # path it cannot know whose cluster it is.
      #
      # Scope, stated because an earlier version of this comment overstated it: the marker
      # guards the LOWERED threshold. A sweep at the six-hour default predates this setting
      # and still runs unguarded, so a shared cluster holding a run older than six hours is
      # not protected by this.
      IRONAUTH_TEST_DB_DISPOSABLE: "1"
      # Debug info is a large part of what this job writes, and this job is the one that
      # ran the runner out of disk. `line-tables-only` keeps the `file:line` a panic
      # backtrace needs (the entire diagnostic value of debug info in a test run) and
      # drops the type and variable DWARF, which nothing here reads because no debugger
      # is attached.
      #
      # THE LARGEST SINGLE THING, now. An earlier version of this comment said it was not,
      # which was true of the run it was written from (24 GB of 46) and stopped being true
      # the moment the Postgres reclaim below landed: measured after it, `target` is 24 GB
      # of 28. So this override is the lever with the most left in it, and it is also the
      # one with no ratchet -- `target` grows with every crate and every test target the
      # project adds, and nothing here bounds that.
      #
      # ONE variable, not two. `cargo test` selects the `test` profile for every unit it
      # builds, and `CARGO_PROFILE_TEST_DEBUG` wins when both are set, so the `DEV` one
      # was dead weight that read as load-bearing.
      #
      # Set as an ENV OVERRIDE rather than a `[profile]` entry in Cargo.toml on purpose:
      # a profile entry would also degrade every local `cargo test`, where a developer
      # DOES attach a debugger and does want the full information. The tradeoff is
      # environment dependent, so it lives with the environment.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # THE OTHER HALF OF THE FOOTPRINT, and the half that grows on its own.
      #
      # The store harness creates a database per test and reclaims leftovers only when
      # they are older than a threshold that defaults to six hours. In CI the Postgres
      # container is created fresh for every job, so nothing in it is ever six hours old,
      # the sweep reclaims NOTHING, and every per-test database survives to the end of the
      # run in the container's DATA VOLUME (the official `postgres` image declares `PGDATA`
      # a volume, so the writable layer measures 63 BYTES after a full run while the volume
      # holds gigabytes; see the report step below, which is where that was measured).
      # That is roughly the 22 GB of the
      # measured 46 that `target` does not account for, and unlike the build it scales
      # with the number of tests, which this project adds to every week.
      #
      # `cargo test` runs test binaries one after another and the sweep runs once per
      # process, so a five-minute threshold reclaims the previous binaries' databases at
      # the start of each new one. Five minutes rather than zero because the sweep's
      # live-connection guard does not cover the window between `CREATE DATABASE` and the
      # first connection to it.
      #
      # This value sits exactly AT `RECLAIM_MIN_AGE_FLOOR_SECS`, so the harness's clamp is
      # a no-op today and the two numbers can drift apart in silence: raise the floor and
      # this is clamped upward, the sweep reclaims less, and the disk problem returns with
      # nothing failing. Raise them together, or lower this deliberately below the floor
      # and let the clamp be the thing that speaks.
      IRONAUTH_TEST_DB_RECLAIM_MIN_AGE_SECS: "300"
    steps:
      - uses: actions/checkout@v7
      # RECLAIM RUNNER DISK, and the reason this step exists at all.
      #
      # From 2026-08-18 22:55 to 2026-08-19, every run of this job died of `No space left
      # on device`. READ off the API, over the eight `test (ubuntu-latest)` jobs in that
      # window, by step conclusion and log availability:
      #
      #   4  steps 1 to 5 succeed and everything from `tests` onward has NO conclusion;
      #      the log endpoint answers `BlobNotFound`.
      #   3  every step has a conclusion and a full log is uploaded.
      #   1  every step has a conclusion and the log endpoint answers `BlobNotFound`.
      #
      # ALSO READ, not inferred, and an earlier version of this comment under-claimed it.
      # The check-run ANNOTATIONS endpoint survives when the log blob does not, and every one
      # of the five no-log jobs carries the runner's own writer path there:
      #
      #   System.IO.IOException: No space left on device :
      #     '/home/runner/actions-runner/cached/2.336.0/_diag/Worker_...log'
      #
      # So "dies in the runner's diagnostic writer" is measured for all of them, not deduced
      # from the blankness. Corroborated by one LOGGED job (95968133506) whose only ENOSPC is
      # that same writer path with zero Postgres 53100 lines, which is why it belongs
      # causally with the blank group.
      #
      # So the middle group is not homogeneous either. TWO of its three carry Postgres
      # 53100 (`could not extend file ...`) inside the tests and end with exit code 101;
      # the third is the runner-writer shape that happened to upload anyway. An earlier
      # version of this comment said "these surface the same exhaustion ... inside the
      # tests", which is true of two of three.
      #
      # Written out this carefully because the first version said "all of them, blank, no
      # log", the second said two shapes four and four, and the third rounded a 2-of-3 to
      # a 3-of-3. A description that erases its own evidence is how the next person
      # concludes there is nothing to read; one that rounds it is how they conclude the
      # wrong thing about it.
      #
      # `--all-features` across 22 workspace members builds every dependency AND a
      # test binary per target -- 320 integration test files, which is the number that
      # actually drives the size -- and that is far larger than the `cargo check` and
      # `cargo clippy` lanes that share the same image and still pass. The image ships
      # toolchains this repository never invokes (Android, .NET, GHC, CodeQL, Swift),
      # so the cheapest correct fix is to stop carrying them.
      #
      # Re-derived on the branch that added ironauth-hooks: 22 members (was 20) and 320
      # integration test files (was 309). That crate also brings wasmtime and cranelift, which
      # are 1.8 GB of `target/debug/deps` on their own, plus a per-build guest fixture
      # directory under OUT_DIR. The 24 GB `target` figure below predates all of it and is now
      # a FLOOR rather than a measurement; the 60 GB disk floor still clears it, but the next
      # person to tune this should re-measure rather than trust the number.
      #
      # `|| true` on each removal: reclaiming space must never be what fails the merge
      # gate, and a future image that drops one of these paths would otherwise turn
      # this into a spurious red. `df` on both sides so the run reports what it
      # actually reclaimed instead of asking a reader to trust this comment.
      - name: reclaim runner disk
        run: |
          df -h / || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/swift || true
          sudo docker image prune --all --force || true
          df -h / || true
          # A FLOOR, checked here rather than reported later, and this is the one fatal
          # thing in the step.
          #
          # The post-build report below is the number everybody wants, and it is exactly
          # the number that vanishes when the runner dies: `if: always()` is evaluated by
          # the runner process, so when THAT is what disk exhaustion kills, no always-step
          # runs. The four blank runs that started this prove it -- their implicit
          # `Post Run` and `Stop containers` steps did not run either.
          #
          # So the guaranteed measurement has to be taken while the runner is certainly
          # alive. A run that cannot fit should fail in three minutes with a reason rather
          # than at the wall-clock limit with a blank log. The number itself is below.
          #
          # The removals above stay `|| true`: reclaiming space must never be what fails
          # the merge gate, and a future image that drops one of those paths must not turn
          # this red. Only the floor is fatal, and it is fatal for a stated number.
          free_gb=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "free after reclaim: ${free_gb}G"
          # A guard that cannot read its own input must SAY so rather than skip.
          #
          # The step's shell is `bash -e` with no `pipefail`. On an empty or malformed
          # value, `[ "" -lt 60 ]` prints "integer expression expected" and returns
          # non-zero; `set -e` does not fire inside an `if` condition, so the else
          # branch is taken and the floor silently does not exist. Without `pipefail`
          # a `df` that fails outright is invisible too, because `tr` still exits 0.
          # That is the same defect as the post-build report it exists to compensate
          # for: a measurement absent exactly when it is needed.
          #
          # The last hole is closed by LENGTH rather than left documented. A run of digits
          # too large for the shell's arithmetic would reach the comparison and take the
          # same silent-else path; it is unreachable through `df -BG --output=avail /`, but
          # "unreachable" is what the earlier version of this comment settled for, and the
          # bound costs one more pattern in a `case` that already runs.
          case "$free_gb" in
            ''|*[!0-9]*)
              echo "::error::could not read free space from df; the floor cannot be checked"
              exit 1
              ;;
          esac
          if [ "${#free_gb}" -gt 6 ]; then
            echo "::error::df reported ${free_gb}G, which is not a plausible free-space reading; the floor cannot be checked"
            exit 1
          fi
          # 60, not 100, and derived from the STANDING components rather than from a
          # completed run, because no run has ever completed this suite.
          #
          # What was measured, and its limit: 28 to 29 G consumed at 239 of the 329 test
          # binaries (24 G `target`, 4.6 to 5.4 G docker). The 89 that never ran are almost
          # all `ironauth-store`, which is the densest per-test-database creator in the
          # workspace and the reason the reclaim override exists, so 28 G is a LOWER BOUND
          # sampled before that crate's own contribution starts.
          #
          # The floor does not rest on it. `target` is fully built at 24 G before the first
          # test runs and does not grow during the run, and docker held between 4.6 and
          # 5.4 G across two measured runs and 3.3 G on a third (this branch's own job
          # 96119283012, which put the volume at 2.5 GB). Those are what 60 is twice over,
          # and the
          # per-test databases the reclaim now sweeps are the term that was unbounded. 60
          # also tolerates a runner image growing by 50 G; a floor of 100 against 113 G
          # free left 13 G of tolerance to an image that grows routinely, which turns a
          # working job red with a message about a footprint it does not have.
          if [ "$free_gb" -lt 60 ]; then
            echo "::error::only ${free_gb}G free after reclaim; this job needs 24G of target plus a docker layer and the per-test databases above it"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the WASM target for the pinned toolchain
        # `ironauth-hooks` builds its guest fixtures for wasm32-wasip2 from a build script,
        # so every job that compiles the workspace needs the target. Added through rustup
        # rather than the action's `targets:` input for the reason the musl job records:
        # rust-toolchain.toml pins the toolchain cargo actually uses, and the action only
        # equips its own.
        #
        # The fixtures are not optional and are deliberately not skippable. They are the
        # hooks that spin, allocate, and try to open a socket, and without them the sandbox
        # tests verify nothing while still reporting green.
        run: rustup target add wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: tests (workspace, all features)
        run: cargo test --workspace --all-features
      - name: doctests
        run: cargo test --workspace --all-features --doc
      # What the run actually cost, reported by the job that pays it.
      #
      # BEST EFFORT, and knowing which parts are is the point: `if: always()` does not
      # survive the runner process dying, which is the failure this job had. The
      # guaranteed number is the floor check above; these are the diagnostic ones.
      #
      # BOTH consumers, not just the one that was already shrunk. `du -sh target` alone
      # measured 24 GB of the 46 GB that run consumed and was blind to the rest, which is
      # how the Postgres side grew unnoticed. (46 is the pre-reclaim figure; with the
      # reclaim active the same job consumes 28.)
      #
      # `sudo du -sh /var/lib/docker` is the one that can SEE the Postgres data.
      # `docker ps --size` cannot: it reports a container's writable layer only, and
      # the official `postgres` image puts `PGDATA` in a declared volume, which
      # `--size` excludes by construction. It reported `63B` after 39 minutes of
      # creating a database per test, which is worse than useless -- a maintainer
      # following this comment to find "which lever to pull" would read it and
      # conclude Postgres is not the lever, which is the exact error this step exists
      # to prevent. `docker system df -v` is used instead because it counts volumes.
      #
      # A TROUGH READING, and worth knowing which. With the sweep running, the Postgres
      # side is a sawtooth and this single end-of-step sample lands near its low point,
      # while an exhaustion would be caused by a peak. NOTHING SAMPLES THE PEAK: the floor
      # fires before a byte is written and this fires after the build, so a mid-run spike
      # is invisible to both. The floor is a pre-flight headroom check, not a peak guard.
      - name: report disk headroom
        if: always()
        run: |
          df -h / || true
          du -sh target 2>/dev/null || true
          sudo du -sh /var/lib/docker 2>/dev/null || true
          # No `head`: the volumes section is the entire reason this replaced
          # `docker ps --size`, and it lands after the images section, whose length depends on what the prune left, one extra image away
          # from being truncated out of the log by a fixed slice.
          docker system df -v 2>/dev/null || true

  # The IRONBUS lane of the dual-mode async matrix (issue #104, criterion 6).
  #
  # The `test` job above already covers the POSTGRES-ONLY mode: it runs
  # `--all-features`, so `outbox_ironbus` compiles there, and with no `IRONBUS_ADDR`
  # each of its cases skips rather than fails. That gating is what makes this lane
  # additive instead of a second place the whole suite can break.
  #
  # This job supplies the other half: a real broker, so the same drain is exercised
  # with a bus attached. It runs the outbox suites ONLY, not the workspace, because the
  # backbone's contract is narrow (a signal wakes the drain; an absent or failing
  # broker degrades to exactly the Postgres behaviour) and everything else about the
  # outbox is mode-independent and already covered above. Running the workspace twice
  # would double a 30-minute job to prove nothing extra.
  ironbus-matrix:
    name: outbox (ironbus mode)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The Postgres above is a per-job SERVICE CONTAINER, created fresh for this job and
      # destroyed with it, so a cluster-wide sweep here can reach nothing but this job's own
      # databases.
      #
      # INERT TODAY, and set anyway. This job runs only `--test outbox --test outbox_ironbus`,
      # so `test_db_reclaim` never executes here and nothing reads the marker; there is also
      # no reclaim override in this job's environment, which a copied version of this comment
      # claimed there was. It is set because the property it asserts is true of this job and
      # the day this job's test list grows is not the day to rediscover that.
      IRONAUTH_TEST_DB_DISPOSABLE: "1"
      IRONBUS_ADDR: 127.0.0.1:17654
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Built from git rather than crates.io: `ironbus-cli` (which carries the broker
      # binary) is not published, only the CLIENT is. Pinned to an exact COMMIT rather
      # than a branch or a tag: a branch lets another repository silently change what
      # this lane tests, and the `v0.1.0` tag predates the `ironbus dev` subcommand this
      # job uses. This SHA is the revision the backbone was actually verified against.
      - name: install the IronBus broker
        run: >-
          cargo install --locked --git https://github.com/ELares/IronBus
          --rev 0ed2f54f127b1096e032f51f971536d7603ad66a ironbus-cli
      - name: start the broker
        run: |
          ironbus dev --addr 127.0.0.1:17654 &
          # Wait for the listener rather than sleeping a guess: a fixed sleep is either
          # flaky on a slow runner or wasted time on a fast one.
          for _ in $(seq 1 60); do
            if nc -z 127.0.0.1 17654; then echo "broker up"; exit 0; fi
            sleep 1
          done
          echo "broker did not come up" >&2
          exit 1
      # Both lanes, in one invocation, so a divergence between them shows up as a
      # single failing job rather than two that have to be compared by hand.
      - name: outbox suites (postgres drain + ironbus backbone)
        run: cargo test -p ironauth-store --features testing,ironbus --test outbox --test outbox_ironbus
      # Webhook delivery, DLQ, and replay under the SAME broker (issue #106, criterion 7).
      #
      # The backbone only decides WHEN the drain runs, never what a consumer does, so
      # `WebhookDeliveryConsumer` is mode-independent by construction. This runs it with a
      # broker present anyway, because "by construction" is an argument and a passing suite
      # is evidence, and the cost is one already-cached test binary.
      - name: webhook delivery (ironbus mode)
        run: cargo test -p ironauth-admin --features testing --test webhook_delivery

  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # rust-toolchain.toml pins 1.97.0 and outranks `rustup default`, which
      # would silently turn this lane into a no-op. RUSTUP_TOOLCHAIN outranks
      # the toolchain file, so the check genuinely runs under 1.85.
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      # TWO crates are excluded, under one rule: a workspace member whose DEPENDENCY declares
      # an MSRV above the workspace promise, and which nothing in the shipped binary's graph
      # depends on, is checked at its own MSRV instead of blocking this lane.
      #
      #   ironauth-cel   -- `cel` 0.14 declares rust-version 1.86
      #   ironauth-hooks -- wasmtime/cranelift 48 declare rust-version 1.95
      #
      # Neither is reachable from `ironauth`, so the SHIPPED binary's MSRV is still 1.85 and the
      # promise in docs/COMPATIBILITY.md is intact. This is not a way to make the number look
      # good: the moment either crate is wired into the binary, the product MSRV becomes that
      # crate's, and raising a published compatibility promise is an owner decision rather than
      # a side effect. The exclusion is what has to come out at that point.
      #
      # This lane has been RED on main since ironauth-cel landed (#993); branch protection
      # requires a review but no CI job, so nothing surfaced it. Fixed here because a branch
      # cannot be green while it is not.
      - run: cargo check --workspace --all-features --all-targets --exclude ironauth-hooks --exclude ironauth-cel

  musl:
    name: musl static build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install musl target for the pinned toolchain
        # rust-toolchain.toml pins the toolchain cargo actually uses, so the
        # target must be added through rustup (which honors the pin), not via
        # the action (which only equips its own toolchain).
        run: rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl -p ironauth
      - name: Verify the binary is static
        run: |
          file target/x86_64-unknown-linux-musl/release/ironauth
          if ldd target/x86_64-unknown-linux-musl/release/ironauth 2>&1 | grep -vq 'not a dynamic executable\|statically linked'; then
            echo "binary is not static" && exit 1
          fi

  deny:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      # The WASM guest fixtures are their OWN workspace with their own lock file, deliberately
      # excluded from the main one so `cargo build --workspace` does not try to build them for
      # the host. That exclusion also put them outside this job entirely: a yanked crate, an
      # unapproved licence, or a RUSTSEC advisory anywhere in that tree would leave this lane
      # green while `crates/ironauth-hooks/build.rs` compiled and EXECUTED its proc macros on
      # every build of the workspace. Same policy file, second lock file.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: crates/ironauth-hooks/guests/Cargo.toml
          # Its OWN policy file. The root one carries advisory ignores whose justifications
          # name crates absent from this workspace, and inheriting them would extend an
          # exception to a graph nobody reasoned about. See that file's header.
          arguments: --config crates/ironauth-hooks/guests/deny.toml

  dev-boot-time:
    name: emulator boots, stays offline, and completes an OTP login
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The emulator brings up its OWN throwaway cluster, so this job needs the Postgres
      # BINARIES but no Postgres service: `initdb` and `pg_ctl`, which is exactly what
      # `dev` looks for. A service container would measure the wrong thing, because a
      # database somebody else already started is not the cold path a user experiences.
      - name: Install PostgreSQL binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
      - run: cargo build -p ironauth --bin ironauth
      # Issue #121 criterion 1. The measured instant is discovery answering 200, not the
      # process starting: a server that has bound its socket but has no signing key answers
      # 404, and calling that "ready" would let the emulator regress into exactly the state
      # it shipped in twice during this issue -- up, quiet, and useless.
      - name: Measure boot to serving
        run: PG_BIN=$(dirname $(ls /usr/lib/postgresql/*/bin/pg_ctl | head -1)) ./scripts/dev-boot-time.sh
      # Issue #121 criterion 2: the emulator is FULLY OFFLINE. Inspection rather than
      # enforcement, deliberately: a severed network would prove only that the emulator
      # survives having none, where this catches a process that quietly reaches out and
      # ignores the failure.
      - name: Install lsof
        run: sudo apt-get install -y lsof
      - name: Assert no egress
        run: PG_BIN=$(dirname $(ls /usr/lib/postgresql/*/bin/pg_ctl | head -1)) ./scripts/dev-no-egress.sh
      # Issue #121 criterion 2: a COMPLETE email-OTP login, offline, against the
      # deterministic code. EXPECT_CODE is pinned so the job fails if seeding stops being
      # reproducible, rather than passing against whatever code happened to be generated --
      # reproducibility is the property the whole seeded emulator rests on.
      - name: Assert a complete offline email-OTP login
        run: |
          PG_BIN=$(dirname $(ls /usr/lib/postgresql/*/bin/pg_ctl | head -1)) \
          EXPECT_CODE=334158 ./scripts/dev-otp-login.sh
      # Issue #120 criterion 1: the HEADLESS login path, driven with no browser anywhere.
      # The device grant's whole premise is a device that cannot open one, so a test that
      # approves through a browser proves nothing about the case the flow exists for. This
      # asserts the POLL SEQUENCE and not just the final token: `authorization_pending`
      # before approval and a token after, which is the contract every RFC 8628 client is
      # written against and which an end-state check alone would not notice breaking.
      - name: Assert a complete headless device-code login
        run: |
          PG_BIN=$(dirname $(ls /usr/lib/postgresql/*/bin/pg_ctl | head -1)) \
          ./scripts/dev-device-login.sh
      # Issue #122 criterion 2: a from-scratch reference client, written from the published
      # spec and contract and NOT from the generated SDKs, passes the published conformance
      # suite against the emulator. It runs here because this job already builds the binary
      # and has the Postgres binaries the emulator brings its own cluster up with.
      - name: Assert the reference client passes the SDK conformance suite
        run: |
          PG_BIN=$(dirname $(ls /usr/lib/postgresql/*/bin/pg_ctl | head -1)) \
          ./scripts/dev-sdk-conformance.sh
      # Issue #121 criterion 3. These tests are `#[ignore]`d because they spawn a real
      # Postgres cluster, and NOTHING ran them: not this workflow, not gate.sh. So the
      # criterion's whole evidence -- that applying the seeds twice does not duplicate
      # state -- was an assertion no gate executed. This job already installs the Postgres
      # binaries they need, so it is where they belong.
      # FILTERED to `dev::`, and that filter is load-bearing. `--ignored` alone runs every
      # ignored test in the binary, and the keychain round trip is also ignored -- so adding
      # it later made this step fail here on "org.freedesktop.secrets was not provided",
      # which is a Linux runner with no Secret Service and nothing to do with the emulator.
      # The keychain test has its own job, on the platforms that have one.
      - name: Run the database-backed emulator tests
        run: |
          PG_BIN=$(dirname $(ls /usr/lib/postgresql/*/bin/pg_ctl | head -1)) \
          cargo test -p ironauth --bin ironauth -- --ignored dev::

  keychain:
    # Issue #120 criterion 4: "Credentials are stored in the platform keychain with expiry on
    # macOS, Windows, and Linux." Every other credential test runs against an in-memory
    # BTreeMap, which proves the seam and says nothing about a keychain. This is the only job
    # that touches a real one, so it runs on all three named platforms and nowhere less.
    name: credentials survive the real platform keychain
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Not fail-fast: a backend that breaks on ONE platform is exactly what this job exists
      # to find, and cancelling the others would hide whether it broke on the rest too.
      fail-fast: false
      matrix:
        # Linux is ABSENT and that is a known gap, not an oversight. See the note below.
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Linux has no keychain until something provides the Secret Service over D-Bus. macOS
      # and Windows have one built in, so only this platform needs setting up.

      # macOS runners start with the login keychain LOCKED, and a locked keychain refuses
      # every write with an error that reads like a backend fault rather than a locked one.
      - name: Unlock the login keychain
        if: matrix.os == 'macos-latest'
        run: security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db || true

      # The test is #[ignore]d because it writes to a developer's own keychain. Here that is
      # the point, so it runs with --ignored.
      - name: Round-trip a credential through the platform keychain
        if: matrix.os != 'ubuntu-latest'
        run: cargo test -p ironauth --bin ironauth -- --ignored a_credential_survives_the_real_platform_keychain

      # LINUX IS NOT COVERED HERE, and the criterion names it. Recorded rather than
      # quietly dropped, because a matrix that used to have three entries and now has two
      # reads as complete unless something says otherwise.
      #
      # What is known, measured on this branch: the build problem is solved (libdbus is
      # vendored, so the crate compiles on a runner with no dbus headers), and the remaining
      # failure is environmental. Under `dbus-run-session` with gnome-keyring unlocked, and
      # again after pre-creating ~/.local/share/keyrings with a default collection, BOTH the
      # read and the STORE answer "Secret Service: no result found" -- so the daemon is
      # running but no usable collection exists for it to write into.
      #
      # One dead end worth not repeating: mapping that message to "no entry" in
      # KeyringStore::get. It makes the read succeed and the store then fails the same way,
      # which is the tell that this is an unusable store rather than an absent item. Shipping
      # that mapping would have made a genuinely broken keychain report "not signed in".

  invariants:
    name: invariant lints, dash scan, compat matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # FULL history. The OpenAPI changelog step diffs the spec against the base branch, and
      # the default shallow checkout has no `origin/main` to resolve -- it failed with
      # "'origin/main' is not a revision here; nothing to compare against", which is the
      # check reporting that it could not run rather than that the spec is unchanged.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The conformance static checks parse the profile matrix and RENDER the
      # runner's plan config, so they need PyYAML. Pin the interpreter (the
      # hash-pinned requirements are resolved for CPython 3.12 on linux) and
      # install with --require-hashes, so this lane installs exactly the reviewed
      # bits or fails. Without this the deep matrix and plan-config checks would
      # silently take their degraded fallback path and enforce less than they say.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: provision the conformance static-check python deps (hash pinned)
        run: python3 -m pip install --require-hashes -r deploy/conformance/requirements.txt
      - name: dormant module scan (a public surface nothing calls)
        run: scripts/dormant-module-scan.sh
      - name: invariant lints
        run: scripts/invariant-lints.sh
      - name: query audit (no scoped-table SQL outside the repository module)
        run: scripts/query-audit.sh
      - name: scoped table registration (every forced-RLS table in the migrations is in the query audit list)
        run: scripts/scoped-table-registration.sh
      - name: audit foreign key claims (no comment asserts an audit_log foreign key that does not exist)
        run: scripts/audit-fk-claim-scan.sh
      # A landed migration's bytes are frozen, comments included: migrate.rs digests the whole
      # file, so editing one makes every already-migrated database refuse to boot with
      # ChecksumMismatch. No test catches it, because every suite runs against a FRESH database
      # whose ledger is empty, so the drift comparison iterates zero times. This job checks out
      # with fetch-depth: 0, which the check requires; it FAILS rather than skipping if the base
      # ref cannot be resolved, since "could not run" is not "nothing changed".
      - name: migration immutability (a landed migration's bytes never change)
        run: scripts/migration-immutability.sh "origin/${{ github.base_ref || 'main' }}"
      - name: test registration (every tests/*.rs file has a [[test]] entry; autotests are off)
        run: scripts/test-registration.sh
      - name: idempotent write audit (no admin handler splits two store writes behind one Idempotency-Key)
        run: scripts/idempotent-write-audit.sh
      - name: event feed producer census (joining the feed is a decision, not an accident)
        run: scripts/event-ordering-audit.sh
      - name: classification lint (every resource type is classified; all three classes used)
        run: scripts/classification-lint.sh
      - name: diagnostics redaction corpus (a sentinel in any free-form diagnostic field would be seen)
        run: scripts/diagnostics-redaction-scan.sh
      - name: canonicalization seam (every identifier comparison routes through the one seam)
        run: scripts/canonicalization-seam.sh
      - name: hashing pool boundary (every request-path hash routes through the admission-controlled pool)
        run: scripts/hashing-pool-boundary.sh
      - name: http audit (no outbound HTTP client outside the fetch dispatcher)
        run: scripts/http-audit.sh
      - name: jose audit (no second JOSE verification path outside ironauth-jose)
        run: scripts/jose-audit.sh
      - name: no M2M metering (no metering/billing/quota hook on the client-credentials path)
        run: scripts/no-m2m-metering.sh
      - name: dash scan
        run: scripts/dash-scan.sh
      - name: emulator doc freshness (the documented CI recipe's OTP code matches CI's pin)
        run: scripts/emulator-doc-freshness.sh
      - name: no plaintext credentials (no login path writes a token to a file)
        run: scripts/no-plaintext-credentials.sh
      # Issue #108 criterion 4. This job already checks out full history for the OpenAPI
      # changelog, which is the same thing this needs: a base revision to diff against.
      - name: event registry compatibility (a breaking payload change bumps its version)
        run: scripts/event-registry-compat.py "origin/${{ github.base_ref || 'main' }}"
      - name: SDK policy (the published policy still matches the SDKs that exist)
        run: scripts/sdk-policy-check.py
      - name: discovery scan (no static discovery JSON; generated at serve time)
        run: scripts/discovery-scan.sh
      - name: rfc9700 scan (every OAuth endpoint bound to a conformance test)
        run: scripts/rfc9700-scan.sh
      - name: route audit (reference app calls only documented public endpoints)
        # The standalone TypeScript reference app (packages/reference-app) is a
        # pure client of the public flow API. This audit is the structural
        # guarantee that every network call it makes targets a documented public
        # endpoint: it diffs the app's declared endpoints against the Rust
        # FLOW_*_PATH constants plus the documented public session endpoints, and
        # fails if any module outside the one audited client performs a network
        # call or names a server path or external URL. It is a static check (no
        # Node needed), so it lives in this python lane.
        run: scripts/route-audit.sh
      - name: admin spa route audit (console calls only documented management endpoints)
        # The admin console SPA (packages/admin-spa, issue #90) is a pure client
        # of the PUBLIC management API. This audit is the structural guarantee
        # that every network call it makes funnels through the one generated
        # typed client and targets a path documented in
        # docs/openapi/management.json (plus the allowlisted OIDC public
        # endpoints the PR2 login module needs). It is a static check (no Node
        # needed), so it lives in this python lane alongside the reference-app
        # route audit. The Node driven codegen freshness and build for this app
        # run in the admin-spa job below.
        run: scripts/admin-spa-route-audit.sh
      - name: conformance harness static checks (results gate, matrix, digest pins, plan config, downgrade confinement)
        # THIS is the conformance enforcement that is real today. It is always-on,
        # runner-independent, gated by NO repository variable, and required on
        # every PR: the results-gate unit tests, the profile matrix and compose
        # shape, that every image reference anywhere under deploy/conformance is
        # pinned by digest, that the runner's plan config actually renders from
        # the matrix, that the harness cannot fail open, and that the cert-only
        # downgrades stay out of the shipped default. The LIVE suite drive is a
        # separate lane below and, until an owner provisions the runner, it
        # enforces nothing and does not pretend to.
        run: scripts/conformance-check.sh
      - name: compatibility matrix freshness
        run: |
          scripts/compat-matrix.sh
          git diff --exit-code docs/COMPATIBILITY.md
      - name: config schema freshness
        run: |
          scripts/config-schema.sh
          git diff --exit-code docs/config-schema.json docs/CONFIG.md
      - name: connector schema freshness (definition + capability matrix)
        run: |
          scripts/connector-schema.sh
          git diff --exit-code docs/connector-schema.json docs/capability-matrix.schema.json
      - name: flow schema freshness (flow object schema + message id registry)
        run: |
          scripts/flow-schema.sh
          git diff --exit-code docs/flow-schema.json docs/flow-messages.json
      - name: journey schema freshness (published journey artifact contract)
        run: |
          scripts/journey-schema.sh
          git diff --exit-code docs/journey-schema.json
      - name: event catalog freshness (generated from the audit action registry)
        # Issue #108: every event type appears in docs/events/catalog.json and docs/EVENTS.md,
        # both generated. A payload schema changed under an unchanged version surfaces here as
        # a diff, which is the registry compatibility check.
        run: scripts/event-catalog.sh
      - name: JWT verification conformance corpus freshness (issue #118)
        # The one corpus every verifier in issue #118 is judged against. It is deterministic,
        # so a diff is always a real change; the failure this exists to catch is a REMOVED or
        # weakened refusal vector, which would make every verifier go green on a token it
        # should refuse.
        run: scripts/verify-vectors.sh
      - name: terraform provider coverage (generated from the OpenAPI document)
        # Issue #51 criterion 6: a new promotable API resource cannot land without provider
        # coverage, enforced as a RATCHET on the uncovered count rather than as a demand for
        # completeness, which would simply get disabled. Pure python, so it belongs in this
        # lane rather than in the Node or Go jobs.
        run: scripts/provider-coverage.sh
      - name: event producer coverage (every management write announces itself)
        # Issue #108 criterion 6. A RATCHET on the uncovered set, for the same reason the
        # provider coverage above is one: a gate that fails from its first commit gets
        # disabled rather than fixed. #108 closes when the baseline file is empty.
        run: scripts/producer-coverage.py
      - name: reference app bindings freshness (generated from the published contract)
        # The reference app's TypeScript types, its schema derived validation
        # constants, and its numeric id to copy map are GENERATED from
        # docs/flow-schema.json and docs/flow-messages.json, so the app and the
        # server cannot diverge on the flow object shape or the message copy.
        # This regenerates them and fails if the committed bindings drift.
        run: scripts/reference-app-bindings.sh
      - name: flow golden corpus freshness (rendered flow shape, all journeys x both transports)
        # The golden corpus LOCKS the rendered flow shape (node set, deterministic order,
        # groups, message ids) for every journey/state on both transports. A breaking change
        # to any journey's rendered flow trips this diff, so it cannot land silently; new
        # journeys or node groups are additive (they add goldens without changing existing ones).
        run: |
          scripts/flow-golden.sh
          git diff --exit-code docs/flow-golden.json
      - name: journey golden-path replay (recorded transcripts vs compiled routing)
        # Re-execute every committed journey transcript against its artifact's compiled routing,
        # the SAME document-order-first-true-guard walk the live engine drives (pinned context,
        # pure evaluator, no database). A version whose routing drifts (a guard edited, a
        # transition added or reordered) makes a recorded transcript diverge and fails here, so
        # behavioral drift between flow versions cannot land silently. The regenerate mode
        # (scripts/journey-replay.sh --regenerate) rewrites the expected outcomes for a reviewable
        # diff when a routing change is deliberate.
        run: scripts/journey-replay.sh
      - name: openapi freshness (served management spec vs committed artifact)
        run: scripts/openapi-check.sh
      - name: OpenAPI contract is generator-ready (issue #122)
        run: scripts/openapi-lint.sh
      - name: OpenAPI changelog generator self-test (issue #122)
        run: python3 scripts/openapi-changelog.py --self-test
      # The other half of #122 criterion 5: the self-test proves the generator, this runs it
      # against the REAL diff so the API-surface change lands in the step summary beside the
      # code review. Reports a breaking change; deliberately never fails on one.
      - name: OpenAPI changelog for this change (issue #122)
        run: scripts/openapi-changelog-ci.sh "origin/${{ github.base_ref || 'main' }}"
      - name: SDK wire-format contract freshness (issue #122)
        run: python3 scripts/sdk-contract.py --check
      - name: Generated management SDKs are fresh (issue #122)
        run: python3 scripts/gen-management-sdks.py --check
      - name: Generated Go SDK builds (issue #122 criterion 4)
        run: cd sdks/go && go build ./...
      - name: Generated Python SDK imports (issue #122 criterion 4)
        run: python3 -c "import importlib.util; s=importlib.util.spec_from_file_location('c','sdks/python/ironauth_management/client_gen.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m)"
      - name: Events-vs-webhooks guidance freshness (issue #107)
        run: python3 scripts/events-vs-webhooks.py --check
      - name: Metering stays off the hot path (issue #107)
        run: scripts/metering-off-hot-path.sh
      - name: governance files present
        # The license and covenant files are trust infrastructure; this lint
        # ensures they cannot be silently removed or renamed.
        run: |
          for f in LICENSE LICENSE-APACHE LICENSE-MIT COVENANTS.md SECURITY.md CONTRIBUTING.md docs/THREAT-MODEL.md docs/WILL-NOT-IMPLEMENT.md; do
            test -s "$f" || { echo "missing required governance file: $f"; exit 1; }
          done
      - name: security.txt is valid and unexpired
        run: |
          python3 - <<'EOF'
          import datetime, re, sys
          text = open('docs/well-known/security.txt', encoding='utf-8').read()
          fields = dict(
              line.split(':', 1) for line in text.splitlines()
              if line.strip() and not line.startswith('#')
          )
          for required in ('Contact', 'Expires'):
              if required not in fields:
                  sys.exit(f'security.txt missing required field: {required}')
          expires = fields['Expires'].strip()
          if not re.match(r'^\d{4}-\d{2}-\d{2}T', expires):
              sys.exit(f'security.txt Expires is not ISO 8601: {expires}')
          when = datetime.datetime.fromisoformat(expires.replace('Z', '+00:00'))
          now = datetime.datetime.now(datetime.timezone.utc)
          if when <= now:
              sys.exit(f'security.txt is expired: {expires}')
          if (when - now).days > 400:
              sys.exit(f'security.txt Expires more than ~13 months out: {expires}')
          print('security.txt: valid, expires', expires)
          EOF

  # The standalone TypeScript reference app (packages/reference-app, issue #85):
  # build and typecheck it so it cannot rot. It is a SEPARATE deployable that
  # runs OUTSIDE the Rust binary, so it is built independently here and is NEVER
  # part of the Rust release pipeline. The build is deliberately minimal: `tsc`
  # over pinned TypeScript, no bundler, no runtime dependency. The route audit
  # and the bindings freshness gate for this app run in the `invariants` job
  # above (they are static python checks that need no Node).
  reference-app:
    name: reference app (tsc build + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: install (pinned toolchain)
        working-directory: packages/reference-app
        run: npm install --no-audit --no-fund
      - name: build and typecheck
        working-directory: packages/reference-app
        # `tsc` typechecks and emits; noEmitOnError is on by default, so a type
        # error fails the build.
        run: npm run build

  # The admin console SPA (packages/admin-spa, issue #90): the repo's first npm
  # prod dependency tree. This job installs from the committed lockfile with
  # `npm ci`, checks the generated management client is fresh against
  # docs/openapi/management.json, typechecks under the strict tsconfig, and runs
  # the Vite build. The route audit for this app is a static python check and
  # runs in the `invariants` job above. Like the reference app this is a SEPARATE
  # deployable, built here and NEVER part of the Rust release pipeline (the
  # in-process serving crate ironauth-admin-ui embeds a committed placeholder so
  # the Rust build needs no Node).
  admin-spa:
    name: admin spa (codegen freshness, typecheck, vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: install (locked, from package-lock.json)
        working-directory: packages/admin-spa
        run: npm ci --no-audit --no-fund
      - name: management client codegen freshness (generated vs committed)
        # Regenerates management.gen.ts from docs/openapi/management.json and
        # fails if the committed client drifts, so the console and the served
        # management contract cannot diverge.
        run: scripts/admin-spa-bindings.sh
      - name: typecheck (strict)
        working-directory: packages/admin-spa
        run: npm run typecheck
      - name: unit and component tests (vitest, jsdom)
        # The shell's pure logic (single-environment collapse, scope injection,
        # ErrorBody mapping) and its components (the verbatim ErrorBody boundary,
        # the command palette keyboard flow, the RFC 9470 sudo path) under the
        # Node toolchain. Runtime end to end stays staged under issue #323.
        working-directory: packages/admin-spa
        run: npm test
      - name: build (vite, content hashed external assets)
        working-directory: packages/admin-spa
        run: npm run build
      - name: sdk install (locked, from package-lock.json)
        working-directory: packages/ironauth-sdk
        run: npm ci --no-audit --no-fund
      - name: SDK check() middleware (issue #100, criterion 6)
        # The uniform authorization `check()`: one call resolving via token claims, via
        # IronAuth's AuthZEN PDP, or via a customer PDP, by configuration. It is a
        # fail-CLOSED authorization primitive, so every failure shape has a test that
        # requires a DENY. Runs in THIS job because it is the one with a Node toolchain;
        # the reference-app bindings freshness check is a pure python lane and has none.
        working-directory: packages/ironauth-sdk
        run: npm test
      - name: embed freshness (committed embed vs a fresh vite build)
        # Rebuilds the console and fails if the committed embed under
        # crates/ironauth-admin-ui/embedded/ drifts, so a plain cargo build (no
        # Node) always ships the real, current console. The Vite build is byte
        # reproducible, so this diff is stable rather than flaky.
        run: scripts/admin-spa-embed.sh

  # The LIVE OIDF suite drive. Read the name: this job is NOT a merge gate and
  # must NOT be added to branch protection while it is unprovisioned.
  #
  # It deliberately has NO job-level `if:`. A job skipped by an `if:` is reported
  # to branch protection as SUCCESS, so gating a REQUIRED check on
  # `vars.CONFORMANCE_ENABLED` would mean unsetting or typo-ing one repository
  # variable silently turns the conformance gate GREEN. A merge gate that can be
  # skipped into a pass is worse than no gate: it asserts a guarantee it is not
  # providing. So the job always runs and says, out loud and in its own name,
  # whether it is enforcing anything.
  #
  # Today the live suite is NOT provisioned (real image digests, the suite's trust
  # of the OP CA, and the OIDF runner are all owner/infra actions), so this lane
  # cannot enforce and does not pretend to: it prints a NOT ENFORCING banner. The
  # conformance enforcement that IS real today is the always-on static lane in the
  # `invariants` job, which no variable gates.
  #
  # Once an owner provisions the runner and sets CONFORMANCE_ENABLED=true, this
  # job drives the merge-gate profile subset and FAILS CLOSED: run-conformance.sh
  # exits non-zero if the runner is missing, if the selection is empty, if the
  # selector crashed, or on any non-PASS module. It cannot be vacuously green.
  sdk-runtimes:
    # The five-runtime portability matrix the SDK core exists for (issue #115).
    #
    # The package's whole premise is that one core runs unmodified on Node, Deno, Bun,
    # Cloudflare Workers and Vercel Edge. A `node:` import compiles, passes every test on
    # Node, and fails ONLY on the runtimes nobody runs the suite on, so the premise has to
    # be executed rather than asserted. `scripts/gate.sh` runs the Node lane locally; this
    # job is the other four.
    #
    # Workers and Vercel Edge are covered by workerd, which is the actual Workers runtime
    # rather than a shim: `vercel dev` needs an account and a deployment, and a lane that
    # cannot run on a fork's PR is a lane that quietly never runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: install (locked)
        working-directory: packages/ironauth-sdk
        run: npm ci --no-audit --no-fund
      - name: build once, run everywhere
        # Compiled ONCE and executed by each runtime, so every lane runs identical
        # JavaScript. Compiling per runtime would let a lane pass against different output.
        working-directory: packages/ironauth-sdk
        run: npx tsc
      # BEFORE the five runtimes: this is the same defect the matrix exists to catch, and
      # it reports it in a second against a diff instead of after provisioning workerd.
      - name: portability scan (no Node-only imports in portable sources)
        run: scripts/sdk-portability-scan.sh
      - name: node (full suite, plus the shared portability checks)
        working-directory: packages/ironauth-sdk
        run: |
          set -euo pipefail
          node --test "dist/**/*.test.js"
          # `run-checks.mjs` exits non-zero on a failed check AND on a short count, which it
          # compares against the EXPECTED_CHECKS it imports from the suite. That is the
          # proof-it-ran guarantee, derived rather than hand-written.
          node workers/run-checks.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno
        working-directory: packages/ironauth-sdk
        # The shared checks, NOT `deno test dist/`. Deno's runner does not collect
        # `node:test` cases, so pointing it at the compiled suite runs ZERO tests and exits
        # 0: a lane that passes by running nothing is worse than no lane.
        #
        # No `--allow-net`, so a module that reached the network on import would fail here.
        run: |
          set -euo pipefail
          # The lane must PROVE it ran: a runtime whose entry point silently does nothing
          # exits 0, and a green step that executed no checks is the failure this whole
          # matrix exists to avoid. `run-checks.mjs` is what proves it, by comparing the
          # count against the EXPECTED_CHECKS it imports and throwing on a mismatch.
          deno run --allow-read --allow-env workers/run-checks.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: bun
        working-directory: packages/ironauth-sdk
        # The shared checks, for the same reason as the Deno lane.
        run: |
          set -euo pipefail
          # As the Node and Deno lanes: the script itself is the proof-it-ran check.
          bun run workers/run-checks.mjs
      - name: workerd (cloudflare workers, and the vercel edge runtime by proxy)
        working-directory: packages/ironauth-sdk/workers
        # Run INSIDE workerd, the real Workers runtime, not under Node with a shim. That
        # distinction is the entire value of this lane: executing the smoke under Node
        # would re-run what the Node lane already covers and prove nothing about Workers.
        #
        # `wrangler dev --local` starts workerd; the smoke imports every portable module,
        # so a `node:` specifier fails at module load and the fetch never answers 200.
        run: |
          set -euo pipefail
          npx --yes wrangler@4 dev --local --port 8787 &
          worker=$!
          trap 'kill "$worker" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/ >/tmp/smoke.json 2>/dev/null; then
              break
            fi
            sleep 2
          done
          cat /tmp/smoke.json
          # Fail on a body that does not say ok, INCLUDING an empty one: a worker that
          # never started would otherwise leave an empty file and pass a looser check.
          node -e '
            const fs = require("node:fs");
            const raw = fs.readFileSync("/tmp/smoke.json", "utf8");
            if (raw.trim() === "") { throw new Error("workerd never answered"); }
            const body = JSON.parse(raw);
            if (!body.ok) { throw new Error("failed in workerd: " + body.failed.join(", ")); }
            // NO hardcoded count here. `smoke.mjs` already compares its run against the
            // EXPECTED_CHECKS it imports from the suite and reports the mismatch as
            // `short`, which the next line checks -- so the number is DERIVED from the
            // suite that defines it and cannot go stale when a check is added. The
            // literal that used to sit here said 7 while the suite had grown to 22, which
            // is how this lane came to fail on every branch: the three sibling greps were
            // removed for exactly this reason and this one was missed.
            if (body.short) { throw new Error("the worker reported a short run"); }
          '


  conformance-live:
    name: OIDF conformance live suite (advisory until provisioned; NOT a gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Least privilege: nothing here writes.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Report whether this lane is enforcing anything
        id: status
        env:
          ENABLED: ${{ vars.CONFORMANCE_ENABLED }}
        run: |
          set -euo pipefail
          if [ "${ENABLED:-}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "ENFORCING: the live OIDF suite runs below and fails closed on any non-PASS."
            exit 0
          fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          cat <<'BANNER'
          ================================================================
          NOT ENFORCING: conformance suite not provisioned.
          ================================================================
          This job verified NOTHING about OIDC conformance. It is green
          because it had nothing to run, not because the provider conforms.

          Outstanding owner/infra actions (docs/conformance/RUNBOOK.md):
            - resolve the real suite image digests in SUITE_VERSION
              (they are all-zero placeholders that fail closed today);
            - wire the suite's trust of the OP self-signed CA;
            - provide the OIDF runner (run-test-plan.py);
            - set the repository variable CONFORMANCE_ENABLED=true.

          Do NOT add this check to branch protection until it is enabled:
          an advisory check promoted to required is a gate that guarantees
          nothing. The conformance checks that DO enforce on every PR are
          in the `invariants` job (scripts/conformance-check.sh), gated by
          no variable at all.
          BANNER
      # Pin the interpreter and install exactly the reviewed, hash-pinned deps.
      # Without this the runner's own dependencies would be absent and the lane
      # could never drive a plan; run-conformance.sh would then (correctly) go RED
      # rather than pass vacuously, which is why provisioning it here matters.
      - uses: actions/setup-python@v7
        if: ${{ steps.status.outputs.enabled == 'true' }}
        with:
          python-version: "3.12"
      - name: Provision the OIDF runner dependencies (hash pinned)
        if: ${{ steps.status.outputs.enabled == 'true' }}
        run: python3 -m pip install --require-hashes -r deploy/conformance/requirements.txt
      - name: Run the merge-gate profile subset (fails closed)
        if: ${{ steps.status.outputs.enabled == 'true' }}
        # Brings up the pinned stack, seeds the deterministic user, generates each
        # plan config from the matrix, drives the Basic / Config / Dynamic / Form
        # Post plans, and fails on any non-PASS (parse_results.py treats
        # WARNING/REVIEW/FAILED/SKIPPED and unfinished as blocking). It also fails
        # if it cannot drive a plan at all. See docs/conformance/RUNBOOK.md.
        working-directory: deploy/conformance
        run: ./run-conformance.sh --trigger merge-gate --up
      - name: Archive suite logs for certification submission
        if: ${{ always() && steps.status.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: conformance-logs-merge-gate
          path: deploy/conformance/results/
          if-no-files-found: ignore
