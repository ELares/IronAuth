# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Scheduled continuous fuzzing of the security-critical parsers and validators.
# The cargo-fuzz targets are nightly-only and live in detached (non-workspace)
# fuzz crates, so they run here on a nightly schedule and on demand rather than
# as a per-PR gate. Every-PR adversarial coverage of the same input space lives
# in the crates' stable regression and property tests (the JOSE CVE corpus, the
# fetcher's adversarial address table), which run in the normal `test` lane.
name: fuzz

on:
  schedule:
    # Nightly, off-peak; arbitrary minute to avoid the top-of-hour herd.
    - cron: "27 4 * * *"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds to run each fuzz target"
        default: "300"

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `dir` is the fuzz crate's PARENT: most live under their crate, and the
        # ceremony harness is the repository-root `fuzz/` crate.
        #
        # EVERY registered target belongs here. A target absent from this matrix has
        # never run, which is exactly how issue #418 sat undetected; keep this list
        # equal to the union of `cargo fuzz list` over every `*/fuzz` crate. As of
        # issue #419 that is 14 targets, matching the 14 `fuzz_targets/*.rs` files and
        # the 14 `[[bin]]` entries.
        #
        # That equality is ENFORCED, not merely documented here: the gate runs
        # `scripts/fuzz-matrix-freshness.sh`, which fails naming any target that is
        # registered but unlisted, or listed but unregistered. It reads this file and
        # the fuzz manifests statically, so it needs no nightly toolchain.
        include:
          - dir: crates/ironauth-jose
            target: verify_jws
          - dir: crates/ironauth-fetch
            target: fetch_validation
          - dir: crates/ironauth-store
            target: redirect_match
          - dir: crates/ironauth-store
            target: canonicalize_identifier
          - dir: crates/ironauth-oidc
            target: flow_submission_parse
          - dir: crates/ironauth-oidc
            target: branding_sanitize
          - dir: .
            target: ceremony_parse
          # Added by issue #419. These landed with their crates (all five importers in
          # #254, `connector_def` in #277, `claim_mapping` in #281) but the matrix last
          # changed in #315 and never gained them, so none had ever run in CI.
          - dir: crates/ironauth-importers
            target: auth0
          - dir: crates/ironauth-importers
            target: firebase
          - dir: crates/ironauth-importers
            target: keycloak
          - dir: crates/ironauth-importers
            target: ldap
          - dir: crates/ironauth-importers
            target: scim
          - dir: crates/ironauth-connector
            target: claim_mapping
          - dir: crates/ironauth-connector
            target: connector_def
    steps:
      - uses: actions/checkout@v4
      # cargo-fuzz needs a nightly toolchain for the sanitizer build. The
      # repository's rust-toolchain.toml pins a stable version, so the fuzz run
      # sets RUSTUP_TOOLCHAIN to override the file (the same technique the msrv
      # lane uses); cargo-fuzz itself installs and builds fine on stable.
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run ${{ matrix.target }}
        working-directory: ${{ matrix.dir }}
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: >-
          cargo fuzz run ${{ matrix.target }} --
          -max_total_time=${{ github.event.inputs.max_total_time || '300' }}
          -timeout=25
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: ${{ matrix.dir }}/fuzz/artifacts/
          if-no-files-found: ignore
