# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Every ecosystem below groups its MINOR and PATCH version updates into a single
# weekly PR. Ungrouped, one quiet week produced twelve open dependabot PRs, each
# needing its own review, its own CI run and its own rebase against a moving
# main under strict up to date branch protection; the batch rots faster than it
# can be merged. MAJOR updates are deliberately left OUT of every group so they
# arrive as individual PRs: a major is the update that can be un-takeable (jsdom
# 30 was, until #515 retired both the cap and its ignore rule), and one
# un-takeable major inside a grouped PR would block every safe minor riding with
# it.
#
# `applies-to: version-updates` is set explicitly on every group so SECURITY
# updates stay ungrouped and keep arriving as their own immediate PRs, never
# waiting on the weekly batch.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # trybuild 1.0.120 declares `rust-version = "1.88"`, above this workspace's
      # 1.85 promise. Measured against the crates.io index 2026-08-19:
      #   1.0.117, 1.0.118, 1.0.119  ->  rust-version 1.85
      #   1.0.120                    ->  rust-version 1.88
      #
      # The `>=1.0, <1.0.120` ceiling in Cargo.toml stops `cargo update` walking
      # into it. This stops dependabot proposing the manifest edit that REMOVES
      # that ceiling, which it otherwise will: it edited Cargo.toml in #864, and
      # it said so itself when #671 was closed ("Closing it will not ignore any
      # of these versions in future pull requests").
      #
      # This repo has done cap-plus-ignore before, for jsdom: #500 added the cap
      # and the ignore together, #515 retired both when the blocker cleared. That
      # rule is NOT in this file any more, so it is named by PR number rather
      # than pointed at.
      #
      # It matters more here than it did there, because 1.0.119 to 1.0.120 is a
      # PATCH bump: a re-proposal does not arrive alone, it rides inside the
      # grouped cargo-minor-patch PR and takes every safe bump with it, which is
      # the failure this file's own header warns about for majors.
      #
      # WHAT RETIRES THIS PAIR. Either the MSRV moves (1.85 is a published
      # promise, so that is a deliberate decision), or trybuild publishes a
      # release that declares a rust-version inside 1.85 again, which is the
      # condition #671 was closed on. The second is worth writing down because
      # this ignore rule removes the channel that would otherwise report it:
      # `>=1.0.120` blocks 1.1.0 and 2.0.0 too, so nothing will arrive to say
      # the wall has moved. Check `rust-version` on the index when revisiting.
      - dependency-name: trybuild
        versions: [">=1.0.120"]
      # sqlx 0.9.0 declares `rust-version = "1.94.0"`, nine minors above this
      # workspace's 1.85 promise. `scripts/msrv-audit.sh` names all seven siblings
      # (sqlx, sqlx-core, sqlx-macros, sqlx-macros-core, sqlx-mysql, sqlx-postgres,
      # sqlx-sqlite) and the `msrv (1.85)` CI lane fails on them, so #924 could not
      # merge whatever else was done to it.
      #
      # THE PORT ITSELF WAS DONE AND IT WORKS, which is why this is an MSRV wall and
      # not a "we did not try". Measured on a throwaway branch: the whole workspace
      # plus every test compiles on 0.9 after three mechanical changes, and the suite
      # got 60 test binaries deep with zero failures before it was stopped as moot.
      # The changes are (1) the `json` feature, which 0.9 stops supplying implicitly
      # and whose absence alone breaks 18 call sites, (2) 79 dynamic-SQL sites wrapped
      # in `AssertSqlSafe` after auditing every one, and (3) ten test helpers taking
      # `&str` that now need an owned string. The audit is the part worth keeping: all
      # 79 interpolate compile-time constants, `&'static str` parameters, or
      # enum-derived SQL fragments, and NONE carries caller or user data.
      #
      # The manifest requirement `"0.8"` already excludes 0.9 by caret semantics, so
      # nothing can walk into it. This rule stops dependabot proposing the manifest
      # EDIT that replaces it, which is what #924 was.
      #
      # WHAT RETIRES THIS: the workspace MSRV moving to 1.94 or above, which is an
      # owner decision about a published promise, not a build detail. There is no
      # "sqlx publishes a lower rust-version" path to wait for here, unlike trybuild.
      - dependency-name: sqlx
        versions: [">=0.9"]
      # rand_chacha 0.9 implements the rand_core 0.9 traits, and this workspace's
      # signing path needs rand_core 0.6. Measured by compiling #923: `elliptic-curve
      # 0.13.8` and `rsa 0.9.10` both require `CryptoRngCore` from rand_core 0.6, so
      # `ChaCha20Rng` from 0.9 does not satisfy the bound and
      # `crates/ironauth-jose/src/signing_key.rs` fails to build at three call sites.
      #
      # This is not a wall we can climb alone: it retires when the RustCrypto stack
      # moves to rand_core 0.9 (elliptic-curve 0.14 and rsa 0.10 or later), and then
      # rand_chacha, elliptic-curve and rsa have to move together as a SET, which is
      # exactly the sibling case `msrv-audit.sh` warns about.
      #
      # The manifest requirement `"0.3"` already excludes it; this stops the proposed
      # manifest edit.
      - dependency-name: rand_chacha
        versions: [">=0.4"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # dtolnay/rust-toolchain is a github-actions dependency, so this rule
      # belongs here and NOT under the npm entry, where it was inert and
      # asserted an MSRV policy it was not enforcing.
      #
      # The `@1.85` ref pinned in the msrv job of .github/workflows/ci.yml IS
      # the MSRV policy, not a dependency version; MSRV bumps are deliberate
      # PRs with changelog entries (docs/RELEASING.md).
      - dependency-name: dtolnay/rust-toolchain
  # The admin console SPA (issue #90), the repo's first npm prod dependency
  # tree. package-lock.json is committed and CI runs npm ci, so dependabot keeps
  # the locked tree current.
  - package-ecosystem: npm
    directory: "/packages/admin-spa"
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
