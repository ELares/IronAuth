#
# Every ecosystem below groups its MINOR and PATCH version updates into a single
# weekly PR. Ungrouped, one quiet week produced twelve open dependabot PRs, each
# needing its own review, its own CI run and its own rebase against a moving
# main under strict up to date branch protection; the batch rots faster than it
# can be merged. MAJOR updates are deliberately left OUT of every group so they
# arrive as individual PRs: a major is the update that can be un-takeable (see
# the jsdom ignore below), and one un-takeable major inside a grouped PR would
# block every safe minor riding with it.
#
# `applies-to: version-updates` is set explicitly on every group so SECURITY
# updates stay ungrouped and keep arriving as their own immediate PRs, never
# waiting on the weekly batch.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # dtolnay/rust-toolchain is a github-actions dependency, so this rule
      # belongs here and NOT under the npm entry, where it was inert and
      # asserted an MSRV policy it was not enforcing.
      #
      # The `@1.85` ref pinned in the msrv job of .github/workflows/ci.yml IS
      # the MSRV policy, not a dependency version; MSRV bumps are deliberate
      # PRs with changelog entries (docs/RELEASING.md).
      - dependency-name: dtolnay/rust-toolchain
  # The admin console SPA (issue #90), the repo's first npm prod dependency
  # tree. package-lock.json is committed and CI runs npm ci, so dependabot keeps
  # the locked tree current.
  - package-ecosystem: npm
    directory: "/packages/admin-spa"
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
