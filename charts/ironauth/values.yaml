# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Defaults are the HIGH-AVAILABILITY shape, not a single-replica demo. An
# operator who runs `helm install` with no values gets three replicas spread
# across nodes with a disruption budget, because the failure this chart exists
# to avoid is an identity provider that goes down with one node.

replicaCount: 3

image:
  repository: ghcr.io/elares/ironauth
  # Empty means "use the chart's appVersion", so the chart and the image it
  # deploys cannot drift apart by accident.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # The server talks to Postgres and to its own peers. It never calls the
  # Kubernetes API, so it is given no token to call it with.
  automountServiceAccountToken: false

service:
  type: ClusterIP
  # The PUBLIC data plane only. The management plane carries health, readiness
  # and Prometheus metrics and is deliberately absent from this Service: it is
  # reached on the pod IP by probes and by a scrape config, never through a
  # cluster Service that an in-cluster caller could find.
  port: 8443
  annotations: {}

server:
  # Inside the pod both planes bind all interfaces: the network boundary is the
  # Service and the NetworkPolicy, not a loopback bind that would also stop
  # kubelet probing the management port.
  bind: "0.0.0.0:8443"
  managementBind: "0.0.0.0:9443"
  # Scheme, host and issuer derive from this, never from request headers.
  # REQUIRED: an issuer that changes with the Host header is a token-forgery
  # surface, so the chart refuses to render without it.
  publicUrl: ""
  shutdownGraceSecs: 25

proxy:
  # Trust nothing by default. Set trustedHops to the number of proxies that
  # actually sit in front of this deployment; 0 means the client IP is the
  # transport peer.
  trustedHops: 0
  trustForwarded: false

telemetry:
  logFormat: "json"
  otlpEndpoint: ""

database:
  # The FULL DSN, credentials included.
  #
  # It goes in a Secret rather than a ConfigMap, and that is not belt-and-braces:
  # `database.url` is a plain string in the config schema with no environment
  # indirection, so the credential has to reach the process inside the file. A
  # chart that rendered this into a ConfigMap would publish the database password
  # to anything that can read ConfigMaps. (`database.password` exists in the
  # schema and is NOT a way out: nothing reads it to build a connection.)
  url: ""
  # Or supply the whole rendered config yourself, e.g. from an external secret
  # manager. When set, the chart renders no Secret of its own and mounts this.
  existingConfigSecret: ""
  # The platform envelope master key (issue #48), read through the config's
  # environment indirection, so it is never written into the file at all.
  masterKey:
    existingSecret: ""
    key: "master-key"

# THE OIDC PROVIDER. Off by default, matching the server's own default and the
# principle the accelerator values follow: a default install mounts nothing it was
# not asked to mount.
#
# It is here because without it the chart COULD NOT MOUNT THE PROVIDER AT ALL. The
# rendered config emitted no [oidc] section, so `oidc.enabled` stayed at its false
# default and a chart install produced three replicas that answered /healthz,
# /readyz and /metrics and served no protocol surface. A chart for an identity
# platform that cannot deploy the identity platform is the gap this closes.
#
# Readiness now ASKS THE DATABASE (issue #149). `/readyz` runs a query on the pool
# requests are served from, so a pod whose schema is not migrated answers 503
# `not ready: schema not migrated` and stays out of its Service until it is. This
# used to be a bare TCP connect that reported Ready whether or not the schema was
# migrated. Run `ironauth migrate` first; the chart README has the sequence.
oidc:
  enabled: false

# The management (control) plane connects as a SEPARATE least-privilege role.
# Unset means the management API is not mounted.
admin:
  controlDatabaseUrl: ""
  # The bootstrap operator bearer token that authorizes tenant CRUD on the
  # operator plane.
  #
  # UNSET MEANS THE MANAGEMENT API IS NOT MOUNTED. Every /v1/* path on the
  # management plane answers a uniform 404, so a deployment cannot create its
  # first tenant, and without a tenant nothing scope-routed answers either:
  # discovery, JWKS and every login flow live under /t/<tenant>/e/<environment>.
  #
  # An earlier version of this comment said the API "still mounts" and rejects
  # requests, copied from a rustdoc that said the same and was also wrong. A 404
  # reads as a wrong URL, which is exactly the wrong place to send someone.
  #
  # BY SECRET REFERENCE ONLY, never a literal. The config schema's own words are
  # "use the `file`/`env` secret indirection, never a literal, outside dev mode",
  # and the chart offers no way to disobey: the value names a Secret, the rendered
  # config carries `{ env = "IRONAUTH_BOOTSTRAP_OPERATOR_TOKEN" }`, and the token
  # itself reaches the process through the environment without ever entering the
  # config file. `database.masterKey` works the same way and for the same reason.
  bootstrapOperatorToken:
    existingSecret: ""
    key: "bootstrap-operator-token"

# ---------------------------------------------------------------------------
# Optional accelerator: IronBus.
#
# OFF, and off means ABSENT: with this disabled the rendered config contains no
# [outbox] broker key at all. IronAuth is complete on Postgres alone, and a
# default install must not imply otherwise or name a service nobody deployed.
#
# Enabled, this writes `outbox.ironbus_addr` into the config file, which is the
# key the server actually reads (crates/ironauth-config, consumed at boot and by
# the readiness tier). An unreachable broker degrades to Postgres polling rather
# than failing the process.
ironbus:
  enabled: false
  # e.g. "ironbus.ironbus.svc.cluster.local:4222"
  addr: ""

# THERE IS STILL NO IronCache VALUE HERE, and the reason has changed.
#
# The earlier reason was that `ironauth-hot`'s IronCache implementation had no address in
# config at all, so a deployment could not attach one however the chart was written. That
# is no longer true: `[hot_state] ironcache_addr` exists, and readiness probes it and
# reports the accelerator tier.
#
# What is STILL true is the half that matters for a values key: no read goes through the
# accelerator. Not because `ironauth-hot` is absent from the serving crates -- it is a
# dependency of `ironauth-oidc` and `ironauth-store`, and `jwks_json` reads its JWKS use in
# production source -- but because NO SHIPPED BINARY INSTALLS AN IMPLEMENTATION, so every
# such call site is inert. A chart value would configure something that reports its own
# reachability and accelerates nothing, which is a smaller version of the same "reads as
# wired when it is not" defect, and a smaller version is still one.
#
# The value would be worth adding the day a binary installs one. `docs/UNIT-COSTS.md` now
# prices what that would buy: a hit against an attached IronCache is 32 to 33 us against a
# 162 us scoped read, where a hit against the Postgres tier is 145 us and buys almost
# nothing.
#
# A deployment that wants the readiness tier today can supply its own config through
# database.existingConfigSecret with a [hot_state] section. A first-class value belongs here
# when a read path consults the accelerator, which is the remaining #146 work.

# ---------------------------------------------------------------------------
# Pod hardening. These are defaults, not suggestions: the chart is linted
# against them, so weakening one here fails CI rather than shipping quietly.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 250m
    memory: 128Mi
  limits:
    memory: 512Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Spread replicas across nodes so a node loss is not an outage. ScheduleAnyway
# rather than DoNotSchedule: on a single-node cluster (kind, k3d, a laptop) a
# hard constraint would leave the deployment permanently Pending, and a chart
# that cannot install on the cluster CI tests it on is not a tested chart.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: ironauth

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

# Probes hit the MANAGEMENT plane, which is where /healthz and /readyz live.
probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
