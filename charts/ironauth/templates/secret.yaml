{{- include "ironauth.validateValues" . -}}
{{- if not .Values.database.existingConfigSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ironauth.configSecretName" . }}
  labels:
    {{- include "ironauth.labels" . | nindent 4 }}
type: Opaque
stringData:
  # A SECRET rather than a ConfigMap, because database.url carries the
  # credential inline. The config schema gives `url` no environment
  # indirection, so there is no way to keep it out of the file, and a
  # ConfigMap would publish it to every reader of ConfigMaps in the namespace.
  ironauth.toml: |
    # Rendered by the IronAuth Helm chart. Do not edit in place.

    [server]
    bind = {{ .Values.server.bind | quote }}
    management_bind = {{ .Values.server.managementBind | quote }}
    public_url = {{ .Values.server.publicUrl | quote }}
    shutdown_grace_secs = {{ .Values.server.shutdownGraceSecs }}

    [proxy]
    trusted_hops = {{ .Values.proxy.trustedHops }}
    trust_forwarded = {{ .Values.proxy.trustForwarded }}

    [telemetry]
    log_format = {{ .Values.telemetry.logFormat | quote }}
    {{- if .Values.telemetry.otlpEndpoint }}
    otlp_endpoint = {{ .Values.telemetry.otlpEndpoint | quote }}
    {{- end }}

    [database]
    url = {{ .Values.database.url | quote }}
    {{- if .Values.database.masterKey.existingSecret }}
    # Read from the environment, so the key itself never lands in this file.
    master_key = { env = "IRONAUTH_MASTER_KEY" }
    {{- end }}
    {{- if .Values.oidc.enabled }}

    # THE PROTOCOL SURFACE. Off, the server answers health, readiness and metrics and
    # nothing else, which is a running process rather than an identity provider.
    [oidc]
    enabled = true
    {{- end }}
    {{- if .Values.admin.controlDatabaseUrl }}

    [admin]
    control_database_url = {{ .Values.admin.controlDatabaseUrl | quote }}
    {{- end }}
    {{- if .Values.ironbus.enabled }}

    [outbox]
    # The key the server actually reads. An unreachable broker degrades to
    # Postgres polling rather than failing the process or wedging the drain.
    ironbus_addr = {{ .Values.ironbus.addr | quote }}
    {{- end }}
{{- end }}
